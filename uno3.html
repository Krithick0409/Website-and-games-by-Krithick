<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNO in the Browser</title>
    <style>
        :root {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin: 20px 0;
        }
        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            max-width: 900px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            margin-bottom: 30px;
        }
        button {
            background: #06b6d4;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1rem;
            cursor: pointer;
            margin: 4px;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card {
            min-width: 90px;
            min-height: 130px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.35);
        }
        .card button {
            width: 100%;
            border-radius: 0 0 10px 10px;
            border-top: 1px solid rgba(0,0,0,0.2);
        }
        .hand-title {
            font-size: 1.2rem;
            margin: 10px 0 5px;
        }
        .top-card-area {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .top-card {
            transform: rotate(-4deg);
        }
        .status-log {
            max-height: 180px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .status-log p {
            margin: 6px 0;
        }
        .hidden {
            display: none !important;
        }
        .color-choice {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-choice button {
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>UNO (Browser Edition)</h1>
        <p>Faithful recreation of the Python terminal game.</p>
    </header>

    <section class="panel" id="setupPanel">
        <h2>Choose Mode</h2>
        <p>Select how you’d like to play.</p>
        <button id="vsComputer">Player vs Computer</button>
        <button id="twoPlayer">Two Players (Hotseat)</button>
    </section>

    <section class="panel hidden" id="gamePanel">
        <div class="top-card-area">
            <div>
                <h2>Top Card</h2>
                <div id="topCard" class="card top-card"></div>
            </div>
            <div>
                <h3>Current Color: <span id="currentColor"></span></h3>
                <p id="turnInfo"></p>
                <p id="drawInfo"></p>
                <button id="drawButton">Draw</button>
                <button id="endTurnButton">End Turn</button>
            </div>
        </div>

        <div id="playerArea"></div>

        <h3>Log</h3>
        <div class="status-log" id="log"></div>
    </section>

    <section class="panel hidden" id="colorPanel">
        <h2>Choose a Color</h2>
        <p id="colorPrompt"></p>
        <div class="color-choice" id="colorChoices"></div>
    </section>

    <script>
        const COLORS = ["Red", "Blue", "Green", "Yellow"];
        const SPECIALS = ["Skip", "Reverse", "Draw2"];

        class Card {
            constructor(color, value) {
                this.color = color;
                this.value = value;
            }

            label() {
                return this.color === "Wild" ? this.value : `${this.color} ${this.value}`;
            }

            canPlayOn(topCard, currentColor) {
                if (this.color === "Wild") return true;
                if (this.color === currentColor) return true;
                if (topCard && this.color === topCard.color) return true;
                if (topCard && this.value === topCard.value) return true;
                return false;
            }
        }

        class Player {
            constructor(name, isComputer = false) {
                this.name = name;
                this.isComputer = isComputer;
                this.hand = [];
            }

            hasUNO() {
                return this.hand.length === 1;
            }
        }

        function createDeck() {
            const deck = [];
            COLORS.forEach(color => {
                deck.push(new Card(color, "0"));
                [...SPECIALS, ..."123456789".split("")].forEach(value => {
                    deck.push(new Card(color, value));
                    deck.push(new Card(color, value));
                });
            });
            for (let i = 0; i < 4; i++) {
                deck.push(new Card("Wild", "Wild"));
                deck.push(new Card("Wild", "WildDraw4"));
            }
            return deck;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        class Game {
            constructor(mode) {
                this.mode = mode;
                this.players = [
                    new Player("Player 1"),
                    mode === "cpu" ? new Player("Computer", true) : new Player("Player 2")
                ];
                this.deck = createDeck();
                shuffle(this.deck);
                this.discard = [];
                this.currentPlayerIndex = 0;
                this.direction = 1;
                this.drawCounter = 0;
                this.currentColor = "";
                this.pendingDrawnCard = null;
                this.gameOver = false;
                this.logEntries = [];
                this.startGame();
            }

            startGame() {
                this.players.forEach(player => {
                    player.hand = this.deck.splice(0, 7);
                });
                // Ensure first card is not wild
                while (true) {
                    const card = this.deck.pop();
                    if (card.color !== "Wild") {
                        this.discard.push(card);
                        this.currentColor = card.color;
                        break;
                    }
                    this.deck.unshift(card);
                }
                this.log(`Game starts! Top card: ${this.topCard().label()}`);
                this.render();
                if (this.currentPlayer().isComputer) {
                    setTimeout(() => this.computerTurn(), 1000);
                }
            }

            topCard() {
                return this.discard[this.discard.length - 1];
            }

            currentPlayer() {
                return this.players[this.currentPlayerIndex];
            }

            nextPlayerIndex(skip = 1) {
                const len = this.players.length;
                return (this.currentPlayerIndex + this.direction * skip + len) % len;
            }

            log(text) {
                this.logEntries.unshift(`${new Date().toLocaleTimeString()}: ${text}`);
                this.logEntries = this.logEntries.slice(0, 30);
            }

            reshuffleIfNeeded() {
                if (this.deck.length === 0) {
                    const top = this.discard.pop();
                    this.deck = this.discard;
                    shuffle(this.deck);
                    this.discard = [top];
                }
            }

            drawCards(n) {
                const drawn = [];
                for (let i = 0; i < n; i++) {
                    this.reshuffleIfNeeded();
                    drawn.push(this.deck.pop());
                }
                return drawn;
            }

            playableCards(player) {
                return player.hand.filter(card => card.canPlayOn(this.topCard(), this.currentColor));
            }

            handlePlayCard(index) {
                if (this.gameOver) return;
                const player = this.currentPlayer();
                const card = player.hand[index];
                if (!card.canPlayOn(this.topCard(), this.currentColor)) {
                    alert("You cannot play that card.");
                    return;
                }
                player.hand.splice(index, 1);
                this.discard.push(card);
                this.currentColor = card.color === "Wild" ? this.currentColor : card.color;
                this.log(`${player.name} plays ${card.label()}`);
                this.pendingDrawnCard = null;
                this.applyCardEffect(card);
                this.checkForWin(player);
            }

            applyCardEffect(card) {
                if (card.value === "Skip") {
                    this.currentPlayerIndex = this.nextPlayerIndex(1);
                    this.log(`${this.currentPlayer().name} is skipped!`);
                } else if (card.value === "Reverse") {
                    this.direction *= -1;
                    this.log("Direction reversed!");
                    if (this.players.length === 2) {
                        this.currentPlayerIndex = this.nextPlayerIndex(1);
                    }
                } else if (card.value === "Draw2") {
                    this.drawCounter += 2;
                    this.log(`Next player must draw ${this.drawCounter}`);
                } else if (card.value === "WildDraw4") {
                    this.drawCounter += 4;
                    this.promptColorChoice(card);
                    return;
                } else if (card.value === "Wild") {
                    this.promptColorChoice(card);
                    return;
                }
                this.advanceTurn();
            }

            promptColorChoice(card) {
                const player = this.currentPlayer();
                const colorPanel = document.getElementById("colorPanel");
                const colorPrompt = document.getElementById("colorPrompt");
                const colorChoices = document.getElementById("colorChoices");
                colorChoices.innerHTML = "";
                colorPrompt.textContent = `${player.name}, pick the new color for ${card.value}`;
                COLORS.forEach(color => {
                    const btn = document.createElement("button");
                    btn.textContent = color;
                    btn.style.background = this.colorToHex(color);
                    btn.onclick = () => {
                        this.currentColor = color;
                        this.log(`${player.name} sets color to ${color}`);
                        colorPanel.classList.add("hidden");
                        this.advanceTurn();
                    };
                    colorChoices.appendChild(btn);
                });
                colorPanel.classList.remove("hidden");
            }

            colorToHex(color) {
                return {
                    Red: "#dc2626",
                    Blue: "#2563eb",
                    Green: "#16a34a",
                    Yellow: "#eab308"
                }[color] || "#94a3b8";
            }

            advanceTurn() {
                if (this.gameOver) return;
                if (this.drawCounter > 0) {
                    this.currentPlayerIndex = this.nextPlayerIndex(1);
                    const player = this.currentPlayer();
                    const drawn = this.drawCards(this.drawCounter);
                    player.hand.push(...drawn);
                    this.log(`${player.name} draws ${drawn.length} cards.`);
                    this.drawCounter = 0;
                } else {
                    this.currentPlayerIndex = this.nextPlayerIndex(1);
                }
                this.render();
                if (this.currentPlayer().isComputer) {
                    setTimeout(() => this.computerTurn(), 800);
                }
            }

            checkForWin(player) {
                if (player.hand.length === 0) {
                    this.gameOver = true;
                    this.log(`${player.name} wins!`);
                    alert(`${player.name} wins!`);
                } else {
                    if (player.hasUNO()) {
                        this.log(`${player.name} shouts UNO!`);
                    }
                    if (cardIsWildPending(this.topCard())) return;
                    this.advanceTurn();
                }
            }

            computerTurn() {
                if (this.gameOver) return;
                const player = this.currentPlayer();
                const playable = this.playableCards(player);
                if (playable.length === 0) {
                    this.drawAction();
                    setTimeout(() => this.advanceTurn(), 600);
                    return;
                }
                playable.sort((a, b) => {
                    if (a.color === this.currentColor && b.color !== this.currentColor) return -1;
                    if (a.color !== this.currentColor && b.color === this.currentColor) return 1;
                    if (a.value.includes("Draw") && !b.value.includes("Draw")) return -1;
                    if (!a.value.includes("Draw") && b.value.includes("Draw")) return 1;
                    return 0;
                });
                const card = playable[0];
                const index = player.hand.findIndex(c => c === card);
                this.handlePlayCard(index);
                if (card.color === "Wild") {
                    this.currentColor = COLORS[Math.floor(Math.random() * COLORS.length)];
                    this.log(`Computer sets color to ${this.currentColor}`);
                    this.advanceTurn();
                }
            }

            drawAction() {
                const player = this.currentPlayer();
                const cards = this.drawCards(Math.max(1, this.drawCounter || 1));
                player.hand.push(...cards);
                this.log(`${player.name} draws ${cards.length} card(s).`);
                if (this.drawCounter > 0) {
                    this.drawCounter = 0;
                    return;
                }
                const playable = cards.filter(card => card.canPlayOn(this.topCard(), this.currentColor));
                if (playable.length > 0 && !player.isComputer) {
                    this.pendingDrawnCard = cards[cards.length - 1];
                    alert("Drawn card is playable! Select it in your hand to use it now.");
                }
            }

            render() {
                document.getElementById("setupPanel").classList.add("hidden");
                document.getElementById("gamePanel").classList.remove("hidden");
                document.getElementById("colorPanel").classList.add("hidden");

                const topCardEl = document.getElementById("topCard");
                const topCard = this.topCard();
                topCardEl.textContent = topCard ? topCard.label() : "N/A";
                topCardEl.style.background = this.colorToHex(topCard.color);

                document.getElementById("currentColor").textContent = this.currentColor;
                document.getElementById("turnInfo").textContent = `Current turn: ${this.currentPlayer().name}`;
                document.getElementById("drawInfo").textContent = this.drawCounter > 0
                    ? `Penalty: Draw ${this.drawCounter}`
                    : "";

                const playerArea = document.getElementById("playerArea");
                playerArea.innerHTML = "";
                const player = this.currentPlayer();
                const handTitle = document.createElement("div");
                handTitle.className = "hand-title";
                handTitle.textContent = `${player.name}'s Hand (${player.hand.length})`;
                playerArea.appendChild(handTitle);
                const cardsDiv = document.createElement("div");
                cardsDiv.className = "cards";
                playerArea.appendChild(cardsDiv);

                player.hand.forEach((card, idx) => {
                    const cardDiv = document.createElement("div");
                    cardDiv.className = "card";
                    cardDiv.style.background = this.colorToHex(card.color);
                    cardDiv.innerHTML = `<div>${card.label()}</div>`;
                    if (!player.isComputer && !this.gameOver) {
                        const playBtn = document.createElement("button");
                        playBtn.textContent = "Play";
                        playBtn.onclick = () => this.handlePlayCard(idx);
                        cardDiv.appendChild(playBtn);
                    }
                    cardsDiv.appendChild(cardDiv);
                });

                document.getElementById("drawButton").disabled = player.isComputer || this.gameOver;
                document.getElementById("endTurnButton").disabled = player.isComputer || this.gameOver;

                const logEl = document.getElementById("log");
                logEl.innerHTML = this.logEntries.map(entry => `<p>${entry}</p>`).join("");
            }
        }

        function cardIsWildPending(card) {
            return card && (card.value === "Wild" || card.value === "WildDraw4");
        }

        let game = null;

        document.getElementById("vsComputer").onclick = () => {
            game = new Game("cpu");
        };
        document.getElementById("twoPlayer").onclick = () => {
            game = new Game("hotseat");
        };
        document.getElementById("drawButton").onclick = () => {
            if (!game) return;
            game.drawAction();
            game.render();
        };
        document.getElementById("endTurnButton").onclick = () => {
            if (!game) return;
            game.advanceTurn();
        };
    </script>
</body>
</html>
