  // ---- Shop animation loop ----
  function shopTick(){
    if(shopEl.classList.contains("open")){
      const t = performance.now()/1000;
      // Cards: idle animation, running on hover
      for(const card of gridEl.children){
        const d = cardData.get(card); if(!d) continue;
        d.t += 1/60;
        drawSkinToCanvas(d.canvas, d.sk, d.hover?"run":"idle", d.t);
      }
      // Preview panel
      const sk = SKIN_BY_ID[selectedId];
      if(sk){
        // Big preview: cycles idle → run → jump
        const cyc = (t*0.6)%3;
        const mode = cyc<1?"idle":(cyc<2?"run":"jump");
        pvCtx.clearRect(0,0,pvCanvas.width,pvCanvas.height);
        // ground line
        pvCtx.fillStyle="rgba(255,255,255,0.08)"; pvCtx.fillRect(0, 40, pvCanvas.width, 1);
        const bx = (pvCanvas.width-16)>>1;
        const by = 24 + (mode==="jump"?-6:0) + Math.sin(t*3)*(mode==="idle"?1:0);
        drawSkinToCanvas(pvCanvas, sk, mode, t);
        // faux trail
        for(let i=0;i<2;i++){
          const p = {x: bx-2-i*4 + Math.random()*3, y: by+14+Math.random()*2, life:.5+Math.random()*.5, size:2, c:"#fff", kind:"trail"};
          trailEmit(sk, [], 0,0,false); // ensure defined
          // just draw a static wisp based on trail color
          switch(sk.trail){
            case "fire": p.c=Math.random()<.5?"#ff8b28":"#ffe27a"; break;
            case "sparkle": p.c="#fff2b0"; break;
            case "hearts": p.c="#ff5c8a"; p.kind="heart"; break;
            case "snow": p.c="#e0eeff"; break;
            case "leaves": p.c="#5abf90"; break;
            case "bubbles": p.c="#a8f0e0"; p.kind="bubble"; break;
            case "stars": p.c="#c470ff"; break;
            case "lightning": p.c="#00f0ff"; break;
            case "smoke": p.c="#8b8fa0"; break;
            case "rainbow": p.c=["#ff3b7a","#ffb84d","#ffe27a","#5fd47a","#4aa8ff","#c470ff"][(i*2+((t*4)|0))%6]; break;
            case "pixels": p.c=sk.pal.T; break;
            case "petals": p.c="#ffb0c4"; break;
            default: p.c=null;
          }
          if(p.c) drawTrailParticle(pvCtx, p);
        }
        // Mini animation strip
        drawSkinToCanvas(pvIdle, sk, "idle", t);
        drawSkinToCanvas(pvRun, sk, "run", t);
        drawSkinToCanvas(pvJump, sk, "jump", t);
      }
    }
    requestAnimationFrame(shopTick);
  }
  requestAnimationFrame(shopTick);

  // ==================================================================
  // EXPANSION PACK: RPG progression, 15 power-ups, 15 obstacle types,
  // 6 collectible variants, combos, chests, bonus rounds, profile UI.
  // Everything below is additive — original systems are wrapped, not rewritten.
  // ==================================================================

  // ---------- Persistence keys ----------
  const LS2 = { xp:"br_xp", lvl:"br_lvl", pres:"br_pres", stats:"br_stats",
    streak:"br_streak", lastDay:"br_lastDay", titles:"br_titles",
    activeTitle:"br_activeTitle", badges:"br_badges" };
  const PROG = {
    xp: +(localStorage.getItem(LS2.xp)||0),
    lvl: Math.max(1, +(localStorage.getItem(LS2.lvl)||1)),
    prestige: +(localStorage.getItem(LS2.pres)||0),
    streak: +(localStorage.getItem(LS2.streak)||0),
    lastDay: localStorage.getItem(LS2.lastDay)||"",
    titles: JSON.parse(localStorage.getItem(LS2.titles)||'["Rookie"]'),
    activeTitle: localStorage.getItem(LS2.activeTitle)||"Rookie",
    badges: JSON.parse(localStorage.getItem(LS2.badges)||"[]"),
    stats: Object.assign({runs:0,deaths:0,jumps:0,carrots:0,bestScore:0,
      obstaclesAvoided:0,powerupsUsed:0,combosMax:0,perfectJumps:0,nearMisses:0,
      chestsOpened:0}, JSON.parse(localStorage.getItem(LS2.stats)||"{}"))
  };
  function xpNeeded(l){ return Math.floor(80 + l*40 + l*l*1.4); }
  function saveProg(){
    localStorage.setItem(LS2.xp,PROG.xp); localStorage.setItem(LS2.lvl,PROG.lvl);
    localStorage.setItem(LS2.pres,PROG.prestige); localStorage.setItem(LS2.streak,PROG.streak);
    localStorage.setItem(LS2.lastDay,PROG.lastDay);
    localStorage.setItem(LS2.titles,JSON.stringify(PROG.titles));
    localStorage.setItem(LS2.activeTitle,PROG.activeTitle);
    localStorage.setItem(LS2.badges,JSON.stringify(PROG.badges));
    localStorage.setItem(LS2.stats,JSON.stringify(PROG.stats));
  }
  const MILESTONES = {
    5:{c:20,title:"Sprinter"},10:{c:40,title:"Dasher",badge:1},
    15:{c:60,title:"Blazer"},20:{c:100,title:"Runner",badge:1},
    25:{c:140,title:"Racer"},30:{c:180,title:"Ace",badge:1},
    35:{c:220,title:"Champion"},40:{c:280,title:"Hero",badge:1},
    45:{c:340,title:"Legend"},50:{c:420,title:"Mythic",badge:1},
    55:{c:480},60:{c:540,badge:1},65:{c:600},
    70:{c:680,badge:1},75:{c:750},80:{c:820,badge:1},
    85:{c:900},90:{c:980,badge:1},95:{c:1080},
    100:{c:1500,title:"Bunny God",badge:1}
  };
  function grantXP(a){
    if(!a||a<=0) return;
    PROG.xp += a|0;
    while(PROG.lvl<100 && PROG.xp>=xpNeeded(PROG.lvl)){
      PROG.xp -= xpNeeded(PROG.lvl); PROG.lvl++;
      const m = MILESTONES[PROG.lvl];
      let msg = "LEVEL "+PROG.lvl+"!";
      if(m){
        if(m.c){ carrotBank += m.c; msg += "  +"+m.c+"🥕"; }
        if(m.title && !PROG.titles.includes(m.title)){ PROG.titles.push(m.title); msg += "  · "+m.title.toUpperCase(); }
        if(m.badge && !PROG.badges.includes("lvl"+PROG.lvl)) PROG.badges.push("lvl"+PROG.lvl);
      }
      levelUpToast(msg);
      if(state===S_PLAY && bunny){ burst(bunny.x+6,bunny.y+8,"#ffe27a",26); flashT=0.35; flashCol=[255,240,140]; }
    }
    saveProg(); if(carrotBank!==+cEl.textContent) cEl.textContent=carrotBank;
    saveAll();
  }

  // ---------- Daily reward + login streak ----------
  function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  const DAILY = [ {c:10,xp:20},{c:15,xp:35},{c:25,xp:55},{c:35,xp:80},{c:55,xp:120},{c:80,xp:180},{c:150,xp:350} ];
  function checkDaily(){
    const t = todayISO();
    if(PROG.lastDay===t) return;
    const gap = PROG.lastDay ? Math.round((new Date(t)-new Date(PROG.lastDay))/86400000) : 99;
    PROG.streak = (gap===1) ? PROG.streak+1 : 1;
    PROG.lastDay = t;
    const day = ((PROG.streak-1)%7);
    const r = DAILY[day];
    carrotBank += r.c; grantXP(r.xp);
    saveAll(); cEl.textContent = carrotBank;
    setTimeout(()=>toast("DAILY +"+r.c+"🥕 +"+r.xp+"XP  STREAK "+PROG.streak+"🔥"), 300);
  }

  // ---------- Level-up floating toast ----------
  const luEl = document.createElement("div");
  luEl.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);"
    + "background:linear-gradient(90deg,#ffb84d,#ff5c8a);color:#1a0f2a;padding:8px 16px;"
    + "font:12px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;"
    + "font-weight:700;z-index:50;display:none;box-shadow:0 4px 20px #ffb84d88;pointer-events:none";
  document.body.appendChild(luEl);
  let luT = 0;
  function levelUpToast(msg){ luEl.textContent = msg; luEl.style.display="block"; luT = performance.now()+2600; }
  setInterval(()=>{ if(luT && performance.now()>luT){ luEl.style.display="none"; luT=0; } }, 200);

  // ---------- Power-ups (15) ----------
  let pupMagnet=0,pupDJump=0,pupHighJump=0,pupCoinX=0,pupScoreX=0,pupGiant=0,pupTiny=0;
  const POWERUPS = [
    {id:"shield",   name:"Shield",       col:"#8ad8ff", dur:0,  fx:()=>{ shieldCount=Math.min(3,shieldCount+1); }},
    {id:"magnet",   name:"Magnet",       col:"#ff8b28", dur:8,  fx:()=>{ pupMagnet=8; }},
    {id:"djump",    name:"Double Jump",  col:"#c470ff", dur:10, fx:()=>{ pupDJump=10; }},
    {id:"dash",     name:"Dash",         col:"#ffe27a", dur:0,  fx:()=>{
      bunny.x = Math.min(bunny.x+64, W-40);
      for(let i=obstacles.length-1;i>=0;i--){ const o=obstacles[i];
        if(o.x>bunny.x-70 && o.x<bunny.x+16){ burst(o.x+o.w/2,o.y+o.h/2,"#ffe27a",10); obstacles.splice(i,1); } }
      invincibleT=Math.max(invincibleT,0.4); screenShake=0.2;
    }},
    {id:"highjump", name:"High Jump",    col:"#7bff9a", dur:8,  fx:()=>{ pupHighJump=8; }},
    {id:"slowmo",   name:"Slow Motion",  col:"#c470ff", dur:5,  fx:()=>{ worldTimeMul=0.5; worldTimeT=5; }},
    {id:"freeze",   name:"Time Freeze",  col:"#aae0ff", dur:3,  fx:()=>{ freezeT=3; flashT=0.25; flashCol=[170,220,255]; }},
    {id:"invin",    name:"Invincibility",col:"#ffb0c4", dur:5,  fx:()=>{ invincibleT=Math.max(invincibleT,5); }},
    {id:"coinx",    name:"Coin ×2",      col:"#ffd24a", dur:10, fx:()=>{ pupCoinX=10; }},
    {id:"scorex",   name:"Score ×2",     col:"#5fd47a", dur:10, fx:()=>{ pupScoreX=10; }},
    {id:"lucky",    name:"Lucky Carrot", col:"#ff5c8a", dur:0,  fx:()=>{
      for(let i=0;i<6;i++) carrots.push({x:W+8+i*22,y:GROUND_Y-40-Math.random()*30,w:10,h:12,t:0,taken:false,type:Math.random()<0.3?"gold":"norm"});
    }},
    {id:"giant",    name:"Giant Bunny",  col:"#c470ff", dur:6,  fx:()=>{ pupGiant=6; pupTiny=0; }},
    {id:"tiny",     name:"Tiny Bunny",   col:"#4aa8ff", dur:8,  fx:()=>{ pupTiny=8; pupGiant=0; }},
    {id:"fireblast",name:"Fire Blast",   col:"#ff5c1a", dur:0,  fx:()=>{
      for(const o of obstacles) burst(o.x+o.w/2,o.y+o.h/2,"#ff5c1a",10);
      obstacles.length=0; flashT=0.35; flashCol=[255,120,60]; screenShake=0.3;
    }},
    {id:"lightning",name:"Lightning",    col:"#00f0ff", dur:0,  fx:()=>{
      const n=Math.min(5,obstacles.length);
      const list=obstacles.slice().sort((a,b)=>a.x-b.x).slice(0,n);
      for(const o of list){ const i=obstacles.indexOf(o); if(i>=0) obstacles.splice(i,1); burst(o.x+o.w/2,o.y+o.h/2,"#00f0ff",14); }
      flashT=0.3; flashCol=[100,220,255]; screenShake=0.2;
    }}
  ];
  const PUP_BY_ID = Object.fromEntries(POWERUPS.map(p=>[p.id,p]));
  let activePups = [];   // {id,t,col,name,max}
  let worldPups  = [];   // pickups floating in world
  let powerupSpawnT = 8;
  function spawnWorldPup(){
    const p = POWERUPS[(Math.random()*POWERUPS.length)|0];
    worldPups.push({x:W+8, y:GROUND_Y-40-Math.random()*40, w:12, h:12, t:0, pid:p.id});
  }
  function activatePowerup(pid){
    const p = PUP_BY_ID[pid]; if(!p) return;
    p.fx();
    const dur = Math.max(p.dur, 1.2);
    const ex = activePups.find(a=>a.id===pid);
    if(ex){ ex.t = dur; ex.max = dur; }
    else activePups.push({id:pid,t:dur,max:dur,col:p.col,name:p.name});
    PROG.stats.powerupsUsed++; saveProg();
    flashT=Math.max(flashT,0.15);
    toast(p.name.toUpperCase());
    try{ snd.shield(); }catch(e){}
  }
  function updatePowerups(dt){
    if(pupMagnet>0) pupMagnet=Math.max(0,pupMagnet-dt);
    if(pupDJump>0)  pupDJump =Math.max(0,pupDJump -dt);
    if(pupHighJump>0)pupHighJump=Math.max(0,pupHighJump-dt);
    if(pupCoinX>0)  pupCoinX =Math.max(0,pupCoinX -dt);
    if(pupScoreX>0) pupScoreX=Math.max(0,pupScoreX-dt);
    if(pupGiant>0)  pupGiant =Math.max(0,pupGiant -dt);
    if(pupTiny>0)   pupTiny  =Math.max(0,pupTiny  -dt);
    for(const a of activePups) a.t -= dt;
    activePups = activePups.filter(a=>a.t>0);

    powerupSpawnT -= dt;
    if(powerupSpawnT<=0){ spawnWorldPup(); powerupSpawnT = 9 + Math.random()*7; }
    for(const p of worldPups){ p.x -= speed*dt; p.t += dt; }
    worldPups = worldPups.filter(p=>p.x+p.w>-6);
    const bx=bunny.x+2, by=bunny.y+2, bw=bunny.w-4, bh=bunny.h-4;
    for(let i=worldPups.length-1;i>=0;i--){
      const p=worldPups[i];
      if(bx<p.x+p.w && bx+bw>p.x && by<p.y+p.h && by+bh>p.y){
        activatePowerup(p.pid); worldPups.splice(i,1);
      }
    }
  }
  function drawWorldPups(){
    for(const p of worldPups){
      const pd = PUP_BY_ID[p.pid];
      const bob = Math.sin(p.t*4)*2;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle=pd.col; ctx.fillRect(p.x-2, p.y+bob-2, 16, 16);
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(p.x+6, p.y+6+bob); ctx.rotate(p.t*1.2);
      ctx.fillStyle=pd.col; ctx.fillRect(-6,-6,12,12);
      ctx.fillStyle="#1a0f2a"; ctx.fillRect(-4,-4,8,8);
      ctx.fillStyle=pd.col; ctx.fillRect(-2,-2,4,4);
      ctx.restore();
    }
  }
  function drawPupHUD(){
    let y = 40;
    for(const a of activePups){
      ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(4,y,74,10);
      ctx.fillStyle=a.col; ctx.fillRect(4,y,Math.max(2,Math.floor(74*a.t/a.max)),10);
      ctx.fillStyle="#0a0518"; ctx.font="6px ui-monospace, monospace";
      ctx.textBaseline="top"; ctx.textAlign="left";
      ctx.fillText(a.name.toUpperCase().slice(0,14), 6, y+2);
      y += 12;
    }
  }

  // ---------- Obstacle types (15) ----------
  function typedSpawn(type){
    const o = {type, x:W+8, y:GROUND_Y-18, w:12, h:18, t:0};
    switch(type){
      case "fire": break;
      case "doubleFire":   o.w=22; break;
      case "tripleFire":   o.w=34; break;
      case "rollingLog":   o.w=22; o.h=14; o.y=GROUND_Y-14; o.roll=0; break;
      case "bees":         o.y=GROUND_Y-56-Math.random()*20; o.h=10; o.w=14; o.osc=Math.random()*Math.PI*2; break;
      case "crow":         o.y=GROUND_Y-72; o.w=16; o.h=10; o.wing=0; break;
      case "fallingRocks": o.y=-10; o.vy=60+Math.random()*30; o.w=10; o.h=10; break;
      case "fireball":     o.y=GROUND_Y-34-Math.random()*30; o.w=12; o.h=12; o.osc=0; break;
      case "axe":          o.y=GROUND_Y-70; o.h=42; o.w=8; o.swing=Math.random()*Math.PI; break;
      case "iceBlock":     o.w=16; o.h=16; o.y=GROUND_Y-16; break;
      case "cracked":      o.w=24; o.h=4;  o.y=GROUND_Y-2; o.pass=true; break;
      case "thorn":        o.w=14; o.h=10; o.y=GROUND_Y-10; break;
      case "wind":         o.w=32; o.h=42; o.y=GROUND_Y-42; o.pass=true; o.push=true; break;
      case "spike":        o.w=10; o.h=10; o.y=GROUND_Y-10; break;
      case "lava":         o.w=14; o.h=24; o.y=GROUND_Y-24; o.geyser=0; break;
    }
    obstacles.push(o);
  }
  function drawTypedObstacle(o){
    const t = o.t||0;
    switch(o.type){
      case "doubleFire": case "tripleFire": {
        const n = o.type==="doubleFire"?2:3;
        for(let i=0;i<n;i++){
          const art=(Math.floor(t+i)%2===0)?FIRE_A:FIRE_B;
          const sway=Math.sin(t*0.6+i)*1|0;
          drawArt(ctx, art, FIRE_PAL, o.x-1+i*11+sway, GROUND_Y-18, 1);
        }
        ctx.fillStyle="rgba(255,120,40,0.15)"; ctx.fillRect(o.x-3,GROUND_Y-16,o.w+6,14);
        break;
      }
      case "rollingLog": {
        ctx.save(); ctx.translate(o.x+o.w/2,o.y+o.h/2); ctx.rotate(o.roll||0);
        ctx.fillStyle="#7b4a20"; ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
        ctx.fillStyle="#3d240f"; ctx.fillRect(-o.w/2,-o.h/2,o.w,2); ctx.fillRect(-o.w/2,o.h/2-2,o.w,2);
        ctx.fillStyle="#a8703a"; ctx.fillRect(-2,-2,4,4);
        ctx.restore();
        break;
      }
      case "bees": {
        ctx.fillStyle="#ffe14a"; ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle="#1a0f2a";
        for(let i=0;i<3;i++) ctx.fillRect(o.x+2+i*4, o.y, 2, o.h);
        ctx.fillStyle=(Math.floor(t*2)%2?"#ffffffaa":"#ffffff55");
        ctx.fillRect(o.x-2, o.y-2, 4, 3); ctx.fillRect(o.x+o.w-2, o.y-2, 4, 3);
        break;
      }
      case "crow": {
        const flap = Math.floor(o.wing||0)%2;
        ctx.fillStyle="#1a1030"; ctx.fillRect(o.x+3, o.y+3, o.w-6, o.h-4);
        ctx.fillStyle="#0a061a";
        if(flap){ ctx.fillRect(o.x-2,o.y,6,3); ctx.fillRect(o.x+o.w-4,o.y,6,3); }
        else    { ctx.fillRect(o.x,o.y+5,6,3); ctx.fillRect(o.x+o.w-6,o.y+5,6,3); }
        ctx.fillStyle="#ff5c8a"; ctx.fillRect(o.x+o.w-2,o.y+4,2,1);
        ctx.fillStyle="#ffe14a"; ctx.fillRect(o.x+o.w-1,o.y+5,1,1);
        break;
      }
      case "fallingRocks": {
        ctx.fillStyle="#7a6a5a"; ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle="#3d3428"; ctx.fillRect(o.x, o.y+o.h-2, o.w, 2);
        ctx.fillStyle="#a89880"; ctx.fillRect(o.x+2, o.y+1, 3, 2);
        if(!o.settled){ ctx.fillStyle="rgba(255,180,60,0.35)"; ctx.fillRect(o.x-1,o.y-1,o.w+2,o.h+2); }
        break;
      }
      case "fireball": {
        ctx.fillStyle="#ff5c1a"; ctx.beginPath(); ctx.arc(o.x+6,o.y+6,6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#ffe27a"; ctx.beginPath(); ctx.arc(o.x+6,o.y+6,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,120,40,0.35)"; ctx.fillRect(o.x-4, o.y+2, 4, 8);
        break;
      }
      case "axe": {
        const s = Math.sin(o.swing||0);
        const cx = o.x+o.w/2, cy = o.y;
        const bladeX = cx + s*10;
        ctx.strokeStyle="#8b8fa0"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bladeX,o.y+o.h); ctx.stroke();
        ctx.fillStyle="#cfd5e0"; ctx.fillRect(bladeX-6,o.y+o.h-8,12,6);
        ctx.fillStyle="#8b8fa0"; ctx.fillRect(bladeX-4,o.y+o.h-4,8,2);
        break;
      }
      case "iceBlock": {
        ctx.fillStyle="#a8d8f0"; ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle="#d8eeff"; ctx.fillRect(o.x, o.y, o.w, 2); ctx.fillRect(o.x, o.y, 2, o.h);
        ctx.fillStyle="#5a8fb8"; ctx.fillRect(o.x+2, o.y+o.h-2, o.w-4, 2);
        ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.beginPath();
        ctx.moveTo(o.x+4,o.y+3); ctx.lineTo(o.x+8,o.y+9); ctx.stroke();
        break;
      }
      case "cracked": {
        ctx.fillStyle="#5a3a2a"; ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle="#2a1a10";
        for(let i=0;i<3;i++) ctx.fillRect(o.x+2+i*8, o.y+1, 1, 2);
        ctx.fillStyle="rgba(255,180,60,0.55)"; ctx.fillRect(o.x+o.w/2-1, o.y-6, 2, 4);
        break;
      }
      case "thorn": {
        ctx.fillStyle="#2f5228"; ctx.fillRect(o.x, o.y+o.h-4, o.w, 4);
        ctx.fillStyle="#5abf50";
        for(let i=0;i<4;i++){
          const bx = o.x+2+i*3;
          ctx.beginPath(); ctx.moveTo(bx,o.y+o.h); ctx.lineTo(bx+1,o.y+2); ctx.lineTo(bx+2,o.y+o.h); ctx.fill();
        }
        break;
      }
      case "wind": {
        ctx.strokeStyle=`rgba(200,240,255,${0.3+Math.sin(t*0.5)*0.2})`; ctx.lineWidth=1;
        for(let i=0;i<5;i++){
          const yy = o.y + i*8 + ((t*10)%8);
          ctx.beginPath(); ctx.moveTo(o.x, yy); ctx.lineTo(o.x+o.w, yy-3); ctx.stroke();
        }
        break;
      }
      case "spike": {
        ctx.fillStyle="#8b8fa0";
        for(let i=0;i<3;i++){
          ctx.beginPath();
          ctx.moveTo(o.x+i*3, o.y+o.h);
          ctx.lineTo(o.x+i*3+2, o.y);
          ctx.lineTo(o.x+i*3+4, o.y+o.h);
          ctx.fill();
        }
        ctx.fillStyle="#cfd5e0"; ctx.fillRect(o.x, o.y+o.h-2, o.w, 2);
        break;
      }
      case "lava": {
        const active = !o.pass;
        if(active){
          ctx.fillStyle="#ff5c1a"; ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillStyle="#ffe27a"; ctx.fillRect(o.x+2, o.y, o.w-4, 4);
          ctx.fillStyle="#ff8b28"; ctx.fillRect(o.x+3, o.y+8, o.w-6, 2);
        } else {
          ctx.fillStyle="#5a2a1a"; ctx.fillRect(o.x, GROUND_Y-4, o.w, 4);
          ctx.fillStyle="rgba(255,180,60,0.4)"; ctx.fillRect(o.x, GROUND_Y-6, o.w, 2);
        }
        break;
      }
      default: { // fallback fire
        const art=(Math.floor(t)%2===0)?FIRE_A:FIRE_B;
        const sway=Math.sin(t*0.6)*1|0;
        drawArt(ctx, art, FIRE_PAL, o.x-1+sway, GROUND_Y-18, 1);
        ctx.fillStyle="rgba(255,120,40,0.15)"; ctx.fillRect(o.x-3,GROUND_Y-16,o.w+6,14);
      }
    }
  }

  // Wrap the base draw / spawn functions
  drawObstacles = function(){
    for(const o of obstacles){
      if(!o.type || o.type==="fire"){
        const art=(Math.floor(o.t)%2===0)?FIRE_A:FIRE_B;
        const sway=Math.sin(o.t*0.6)*1|0;
        drawArt(ctx, art, FIRE_PAL, o.x-1+sway, GROUND_Y-18, 1);
        ctx.fillStyle="rgba(255,120,40,0.15)"; ctx.fillRect(o.x-3,GROUND_Y-16,o.w+6,14);
      } else drawTypedObstacle(o);
    }
    drawChest(); drawWorldPups();
  };
  spawnFire = function(){
    const pool = ["fire","fire","fire","doubleFire","thorn","spike","iceBlock"];
    if(distance>600)  pool.push("tripleFire","rollingLog","fireball","cracked");
    if(distance>1500) pool.push("bees","crow","axe","fallingRocks");
    if(distance>3000) pool.push("wind","lava");
    typedSpawn(pool[(Math.random()*pool.length)|0]);
  };

  // ---------- Carrot variants (6) ----------
  const CARROT_PALS = {
    norm: CARROT_PAL,
    gold: {O:"#ffd24a",o:"#ffec8a",D:"#a87a20",G:"#3fbf4a",g:"#2f8f39"},
    rainbow: CARROT_PAL,
    crystal: {O:"#aae0ff",o:"#e0f8ff",D:"#4a80c0",G:"#5fd47a",g:"#2f8f39"},
    mystery: {O:"#c470ff",o:"#e0b8ff",D:"#5a2a80",G:"#c470ff",g:"#5a2a80"},
    giant: CARROT_PAL
  };
  function pickCarrotType(){
    const r = Math.random();
    if(r<0.66) return "norm";
    if(r<0.83) return "gold";
    if(r<0.91) return "crystal";
    if(r<0.96) return "rainbow";
    if(r<0.985) return "mystery";
    return "giant";
  }
  spawnCarrot = function(){
    const y = GROUND_Y-24-(Math.random()<0.4?30:0);
    carrots.push({x:W+8, y, w:10, h:12, t:Math.random()*10, taken:false, type:pickCarrotType()});
  };
  function drawTypedCarrot(c){
    const bob=Math.sin(c.t*1.5)*1|0;
    if(c.type==="giant"){
      ctx.save(); ctx.translate(c.x-3, c.y-4+bob); ctx.scale(1.6,1.6);
      drawArt(ctx, CARROT, CARROT_PAL, 0, 0, 1);
      ctx.restore();
      ctx.fillStyle="rgba(255,220,120,0.6)"; ctx.fillRect(c.x-2, c.y+bob-1, 2, 2);
    } else if(c.type==="rainbow"){
      const hue = (performance.now()/6 + c.x)%360;
      ctx.save(); ctx.filter=`hue-rotate(${hue}deg) saturate(1.6)`;
      drawArt(ctx, CARROT, CARROT_PAL, c.x, c.y+bob, 1);
      ctx.restore(); ctx.filter="none";
    } else {
      drawArt(ctx, CARROT, CARROT_PALS[c.type]||CARROT_PAL, c.x, c.y+bob, 1);
    }
    if(c.type==="mystery"){
      ctx.fillStyle=`rgba(196,112,255,${0.3+Math.sin(c.t*3)*0.2})`;
      ctx.fillRect(c.x-2, c.y+bob-2, c.w+4, c.h+4);
      ctx.fillStyle="#fff"; ctx.font="6px ui-monospace, monospace"; ctx.textAlign="center";
      ctx.fillText("?", c.x+5, c.y+bob+2);
    } else if(c.type==="crystal"){
      ctx.fillStyle=`rgba(170,220,255,${0.3+Math.sin(c.t*4)*0.2})`;
      ctx.fillRect(c.x-1, c.y+bob-1, c.w+2, c.h+2);
    } else if(c.type==="gold"){
      ctx.fillStyle=`rgba(255,220,80,${0.25+Math.sin(c.t*5)*0.15})`;
      ctx.fillRect(c.x-1, c.y+bob-1, c.w+2, c.h+2);
    }
  }
  drawCarrots = function(){
    for(const c of carrots){
      if(!c.type || c.type==="norm"){
        const bob=Math.sin(c.t*1.5)*1|0;
        drawArt(ctx, CARROT, CARROT_PAL, c.x, c.y+bob, 1);
      } else drawTypedCarrot(c);
    }
  };

  // ---------- Combo, near-miss, perfect jump ----------
  let combo = 0, comboT = 0;
  function updateCombo(dt){
    if(comboT>0){ comboT -= dt; if(comboT<=0) combo=0; }
    for(const o of obstacles){
      if(o._counted) continue;
      if(o.pass) continue;
      if(o.x+o.w < bunny.x){
        o._counted = true;
        PROG.stats.obstaclesAvoided++;
        if(!bunny.onGround){
          combo++; comboT = 2.5;
          if(combo>PROG.stats.combosMax) PROG.stats.combosMax = combo;
          PROG.stats.nearMisses++;
          score += 10*combo;
          grantXP(2+combo);
          burst(o.x+o.w/2, o.y-2, "#ffe27a", 6);
          // perfect jump: close vertical proximity
          const dy = (bunny.y+bunny.h) - o.y;
          if(dy>=-4 && dy<=6){ PROG.stats.perfectJumps++; score+=20; burst(bunny.x+6,bunny.y+8,"#7bff9a",6); }
        }
      }
    }
  }

  // ---------- Chest + bonus round events ----------
  let chest = null, bonusRoundT = 0, nextEventScore = 500;
  function updateEvents(dt){
    if(chest){
      chest.x -= speed*dt; chest.t = (chest.t||0)+dt;
      if(chest.x+chest.w<-10) chest=null;
      else {
        const bx=bunny.x+2, by=bunny.y+2;
        if(bx<chest.x+chest.w && bx+10>chest.x && by<chest.y+chest.h && by+12>chest.y){
          openChest(); chest=null;
        }
      }
    }
    if(bonusRoundT>0){
      bonusRoundT -= dt;
      if(Math.random()<0.5){
        carrots.push({x:W+8,y:GROUND_Y-30-Math.random()*50,w:10,h:12,t:0,taken:false,
          type: Math.random()<0.25?"gold":"norm"});
      }
      if(bonusRoundT<=0){ toast("BONUS ROUND END"); flashT=0.3; flashCol=[255,220,120]; }
    }
    if(score>=nextEventScore){
      nextEventScore = score + 400 + Math.random()*400;
      const roll = Math.random();
      if(roll<0.4){ chest = {x:W+8, y:GROUND_Y-16, w:14, h:14, t:0}; toast("REWARD CHEST INCOMING"); }
      else if(roll<0.6){ bonusRoundT = 6; toast("BONUS ROUND · CARROT RAIN"); obstacles.length = 0; }
      else if(roll<0.8){ spawnWorldPup(); spawnWorldPup(); toast("POWER-UP DROP"); }
    }
  }
  function openChest(){
    const c = 20 + Math.floor(Math.random()*40);
    const x = 30 + Math.floor(Math.random()*60);
    carrotBank += c; grantXP(x);
    burst(bunny.x+6, bunny.y+8, "#ffd24a", 30);
    flashT=0.35; flashCol=[255,220,120]; screenShake=0.3;
    PROG.stats.chestsOpened++; saveProg();
    toast("CHEST +"+c+"🥕  +"+x+"XP");
    if(Math.random()<0.6){ const p = POWERUPS[(Math.random()*POWERUPS.length)|0]; activatePowerup(p.id); }
  }
  function drawChest(){
    if(!chest) return;
    const bob = Math.sin(chest.t*4)*1|0;
    ctx.fillStyle=`rgba(255,220,120,${0.3+Math.sin(chest.t*6)*0.2})`;
    ctx.fillRect(chest.x-2, chest.y+bob-2, chest.w+4, chest.h+4);
    ctx.fillStyle="#a8703a"; ctx.fillRect(chest.x, chest.y+bob, chest.w, chest.h);
    ctx.fillStyle="#ffd24a"; ctx.fillRect(chest.x, chest.y+bob+chest.h/2-1, chest.w, 2);
    ctx.fillStyle="#3d240f"; ctx.fillRect(chest.x+chest.w/2-1, chest.y+bob+chest.h/2-1, 2, 3);
  }

  // ---------- equippedSkin wrap for temporary powerup traits ----------
  const _origEquippedSkin = equippedSkin;
  equippedSkin = function(){
    const sk = _origEquippedSkin();
    if(pupMagnet<=0 && pupDJump<=0 && pupHighJump<=0) return sk;
    const t = Object.assign({}, sk.traits||{});
    if(pupMagnet>0)   t.magnet     = Math.max(t.magnet||0, 130);
    if(pupDJump>0)    t.doubleJump = true;
    if(pupHighJump>0) t.highJump   = Math.max(t.highJump||1, 1.35);
    return Object.assign({}, sk, {traits:t});
  };

  // ---------- Wrap update: pre-hook (typed carrot bonuses) + post-hook (systems) ----------
  const _origUpdate = update;
  update = function(dt){
    // Pre-hook: typed carrot bonuses BEFORE original picks them up.
    if(state===S_PLAY && bunny){
      const bx=bunny.x+2, by=bunny.y+2, bw=bunny.w-4, bh=bunny.h-4;
      for(const c of carrots){
        if(c.taken || !c.type || c.type==="norm") continue;
        if(bx<c.x+c.w && bx+bw>c.x && by<c.y+c.h && by+bh>c.y){
          const scoreMul = (pupScoreX>0?2:1), coinMul = (pupCoinX>0?2:1);
          let sb=0, cb=0, xb=0;
          if(c.type==="gold"){    sb=25; cb=2; xb=6; }
          else if(c.type==="crystal"){ sb=15; cb=1; xb=20; }
          else if(c.type==="rainbow"){ const p=POWERUPS[(Math.random()*POWERUPS.length)|0]; activatePowerup(p.id); sb=5; cb=1; xb=6; }
          else if(c.type==="mystery"){
            const r=Math.random();
            if(r<0.33){ cb+=9; toast("MYSTERY +"+(cb+1)+"🥕"); }
            else if(r<0.66){ sb+=75; toast("MYSTERY +"+(sb+25)+" SCORE"); }
            else { const pp=POWERUPS[(Math.random()*POWERUPS.length)|0]; activatePowerup(pp.id); }
          }
          else if(c.type==="giant"){ sb=125; cb=7; xb=25; }
          score += sb*scoreMul; carrotBank += cb*coinMul; grantXP(xb);
          burst(c.x+5, c.y+6, "#ffe27a", 10);
        }
      }
      // Bunny size for giant/tiny
      if(pupGiant>0){ bunny.w=18; bunny.h=22; }
      else if(pupTiny>0){ bunny.w=8; bunny.h=11; }
      else { bunny.w=12; bunny.h=16; }
    }
    _origUpdate(dt);
    if(state!==S_PLAY) return;
    updatePowerups(dt);
    updateEvents(dt);
    updateCombo(dt);
    // Survival XP: 1 xp per 2 seconds
    _survAcc = (_survAcc||0) + dt;
    if(_survAcc>=2){ _survAcc=0; grantXP(1); }
  };
  let _survAcc = 0;

  // ---------- Wrap reset (session cleanup) ----------
  const _origReset = reset;
  reset = function(){
    _origReset();
    activePups.length=0; worldPups.length=0; powerupSpawnT = 8;
    pupMagnet=pupDJump=pupHighJump=pupCoinX=pupScoreX=pupGiant=pupTiny=0;
    combo=0; comboT=0; chest=null; bonusRoundT=0; nextEventScore=500; _survAcc=0;
    // Milestone starting bonuses
    if(PROG.badges.includes("lvl20")) carrotBank += 5;
    if(PROG.badges.includes("lvl50")) { shieldCount = Math.max(shieldCount,1); }
    if(PROG.badges.includes("lvl100")){ pupCoinX = 15; activePups.push({id:"coinx",t:15,max:15,col:"#ffd24a",name:"Coin ×2"}); }
  };

  // ---------- Session/run tracking via state transitions ----------
  let _prevState = state;
  setInterval(()=>{
    if(_prevState!==S_PLAY && state===S_PLAY){ PROG.stats.runs++; saveProg(); }
    if(_prevState===S_PLAY && state===S_OVER){
      PROG.stats.deaths++;
      const sc = Math.floor(score);
      if(sc>PROG.stats.bestScore) PROG.stats.bestScore = sc;
      grantXP(Math.floor(sc/8));
      saveProg();
    }
    _prevState = state;
  }, 100);

  // ---------- Extend ability HUD with pups + combo + level bar ----------
  const _origAbHud = drawAbilityHUD;
  drawAbilityHUD = function(){
    _origAbHud();
    drawPupHUD();
    // XP mini-bar (top-right)
    const barW=80, barH=4;
    const x = W - barW - 6, y = 8;
    const need = xpNeeded(PROG.lvl);
    const ratio = PROG.lvl>=100 ? 1 : Math.min(1, PROG.xp/need);
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(x-1,y-1,barW+2,barH+2);
    ctx.fillStyle="#ffb84d"; ctx.fillRect(x,y,Math.floor(barW*ratio),barH);
    ctx.fillStyle="#fff5d6"; ctx.font="6px ui-monospace, monospace";
    ctx.textAlign="right"; ctx.textBaseline="top";
    ctx.fillText("LV "+PROG.lvl+(PROG.prestige?" ✦"+PROG.prestige:""), W-6, y+barH+1);
    if(combo>1){
      ctx.textAlign="center"; ctx.fillStyle="#ffe27a"; ctx.font="10px ui-monospace, monospace";
      ctx.fillText("×"+combo+" COMBO", W/2, 18);
    }
    if(bonusRoundT>0){
      ctx.textAlign="center"; ctx.fillStyle="#ffd24a"; ctx.font="8px ui-monospace, monospace";
      ctx.fillText("BONUS "+bonusRoundT.toFixed(1)+"s", W/2, 32);
    }
  };

  // ---------- Extend main menu with XP bar / title / profile hint ----------
  const _origDrawMenu = drawMenu;
  drawMenu = function(){
    _origDrawMenu();
    const barW = 200, barH = 6, bx = (W-barW)>>1, by = 156;
    const need = xpNeeded(PROG.lvl);
    const ratio = PROG.lvl>=100 ? 1 : Math.min(1, PROG.xp/need);
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(bx-1,by-1,barW+2,barH+2);
    const g = ctx.createLinearGradient(bx,by,bx+barW,by);
    g.addColorStop(0,"#ffb84d"); g.addColorStop(1,"#ff5c8a");
    ctx.fillStyle=g; ctx.fillRect(bx,by,Math.floor(barW*ratio),barH);
    text("LV "+PROG.lvl+(PROG.prestige?" ✦"+PROG.prestige:"")+"   "+PROG.xp+" / "+need+" XP", W/2, by+8, 7, "#fff5d6");
    text("TITLE: "+PROG.activeTitle.toUpperCase()+"   STREAK "+PROG.streak+"🔥", W/2, by+18, 7, "#ffb066");
    text("F — PROFILE   E — ABILITY   S — SHOP", W/2, 224, 6, "#fff5d688");
  };

  // ---------- Profile DOM overlay ----------
  const profileEl = document.createElement("div");
  profileEl.id = "profile";
  profileEl.style.cssText = "position:fixed;inset:0;background:radial-gradient(ellipse at center,#12081e 0%,#05030a 100%);"
    +"display:none;flex-direction:column;z-index:25;padding:16px 20px;color:#f8f5e6;"
    +"font-family:ui-monospace,monospace;letter-spacing:1px;overflow:auto";
  profileEl.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid #ffffff22">'
    +'<h1 style="margin:0;font-size:18px;letter-spacing:3px;color:#ffb84d;text-shadow:2px 2px 0 #000">PROFILE</h1>'
    +'<span style="font-size:10px;letter-spacing:2px;color:#8f83b0">RPG PROGRESSION · LV 1-100 · PRESTIGE</span>'
    +'<button id="closeProfile" style="margin-left:auto;background:#2a0f24;border:1px solid #ff5c8a;color:#fff;padding:6px 12px;cursor:pointer;font-family:inherit;letter-spacing:2px;text-transform:uppercase;font-size:11px">CLOSE ✕</button>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:12px">'
    +'<div style="background:#0f0820;border:2px solid var(--r-legend);padding:12px">'
    +'<div style="font-size:16px;letter-spacing:2px;color:#ffb84d" id="pfLvl">LV 1</div>'
    +'<div style="font-size:10px;color:#a89ecf;margin-top:6px" id="pfXP">0 / 100 XP</div>'
    +'<div style="background:#000;height:8px;margin-top:4px;border:1px solid #ffffff22"><div id="pfBar" style="height:100%;background:linear-gradient(90deg,#ffb84d,#ff5c8a);width:0%"></div></div>'
    +'<div style="margin-top:12px;font-size:10px;color:#cfc7e6">TITLE: <b id="pfTitle" style="color:#ffb84d"></b></div>'
    +'<div style="font-size:10px;color:#cfc7e6">STREAK: <b id="pfStreak" style="color:#ffe27a"></b></div>'
    +'<div style="font-size:10px;color:#cfc7e6">PRESTIGE: <b id="pfPrestige" style="color:#c470ff"></b></div>'
    +'<button id="pfPrestigeBtn" style="margin-top:10px;padding:8px 14px;background:linear-gradient(90deg,#c470ff,#ff5c8a);color:#1a0f2a;border:none;cursor:pointer;font-family:inherit;letter-spacing:2px;font-size:11px;font-weight:700;display:none">PRESTIGE ✦ +BONUS</button>'
    +'</div>'
    +'<div style="background:#0f0820;border:2px solid var(--r-rare);padding:12px">'
    +'<div style="font-size:12px;letter-spacing:2px;color:#4aa8ff;margin-bottom:8px">LIFETIME STATS</div>'
    +'<div id="pfStats" style="font-size:10px;color:#cfc7e6;line-height:1.7"></div>'
    +'</div>'
    +'<div style="background:#0f0820;border:2px solid var(--r-uncommon);padding:12px;grid-column:1/3">'
    +'<div style="font-size:12px;letter-spacing:2px;color:#5fd47a;margin-bottom:8px">TITLES · CLICK TO EQUIP</div>'
    +'<div id="pfTitles" style="display:flex;flex-wrap:wrap;gap:6px"></div>'
    +'</div>'
    +'<div style="background:#0f0820;border:2px solid var(--r-epic);padding:12px;grid-column:1/3">'
    +'<div style="font-size:12px;letter-spacing:2px;color:#c470ff;margin-bottom:8px">MILESTONE BADGES</div>'
    +'<div id="pfBadges" style="display:flex;flex-wrap:wrap;gap:8px"></div>'
    +'</div>'
    +'<div style="background:#0f0820;border:2px solid #ffffff22;padding:12px;grid-column:1/3">'
    +'<div style="font-size:12px;letter-spacing:2px;color:#ffb066;margin-bottom:8px">POWER-UPS · 15 TYPES · SPAWN IN-RUN</div>'
    +'<div id="pfPups" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px"></div>'
    +'</div>'
    +'</div>';
  document.body.appendChild(profileEl);
  document.getElementById("closeProfile").onclick = ()=> toggleProfile(false);
  function toggleProfile(force){
    const on = force===undefined ? profileEl.style.display!=="flex" : force;
    if(on){ renderProfile(); profileEl.style.display="flex"; }
    else profileEl.style.display="none";
  }
  function renderProfile(){
    const need = xpNeeded(PROG.lvl);
    document.getElementById("pfLvl").textContent = "LV "+PROG.lvl+(PROG.prestige?"  ✦"+PROG.prestige:"");
    document.getElementById("pfXP").textContent = PROG.xp+" / "+need+" XP";
    document.getElementById("pfBar").style.width = Math.min(100, PROG.xp/need*100)+"%";
    document.getElementById("pfTitle").textContent = PROG.activeTitle;
    document.getElementById("pfStreak").textContent = PROG.streak+" DAYS 🔥";
    document.getElementById("pfPrestige").textContent = PROG.prestige+" ✦";
    document.getElementById("pfPrestigeBtn").style.display = PROG.lvl>=100?"inline-block":"none";
    const s = PROG.stats;
    document.getElementById("pfStats").innerHTML =
      "RUNS: <b>"+s.runs+"</b><br>DEATHS: <b>"+s.deaths+"</b><br>JUMPS: <b>"+s.jumps+"</b><br>"
      +"CARROTS: <b>"+s.carrots+"</b><br>OBSTACLES AVOIDED: <b>"+s.obstaclesAvoided+"</b><br>"
      +"NEAR MISSES: <b>"+s.nearMisses+"</b><br>PERFECT JUMPS: <b>"+s.perfectJumps+"</b><br>"
      +"MAX COMBO: <b>"+s.combosMax+"</b><br>POWER-UPS USED: <b>"+s.powerupsUsed+"</b><br>"
      +"CHESTS OPENED: <b>"+s.chestsOpened+"</b><br>BEST SCORE: <b>"+s.bestScore+"</b>";
    const tt = document.getElementById("pfTitles"); tt.innerHTML="";
    for(const t of PROG.titles){
      const b = document.createElement("button");
      b.style.cssText="padding:5px 10px;font-family:inherit;font-size:10px;letter-spacing:1px;"
        +"background:"+(PROG.activeTitle===t?"#ffb84d":"#160b28")+";color:"+(PROG.activeTitle===t?"#1a0f2a":"#fff")
        +";border:1px solid #ffffff33;cursor:pointer;text-transform:uppercase";
      b.textContent=t;
      b.onclick=()=>{ PROG.activeTitle=t; saveProg(); renderProfile(); };
      tt.appendChild(b);
    }
    const bb = document.getElementById("pfBadges"); bb.innerHTML="";
    for(const lvl of Object.keys(MILESTONES).sort((a,b)=>+a-+b)){
      const m = MILESTONES[lvl];
      const has = PROG.lvl>=+lvl;
      const d = document.createElement("div");
      d.style.cssText="width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;"
        +"background:"+(has?"linear-gradient(135deg,#ffb84d,#ff5c8a)":"#160b28")
        +";color:"+(has?"#1a0f2a":"#4a4060")+";font-size:12px;font-weight:700;letter-spacing:1px;"
        +"border:1px solid "+(has?"#ffb84d":"#ffffff22");
      d.innerHTML = (has?lvl:"?")+"<span style='font-size:7px;margin-top:2px;letter-spacing:1px'>"+(m.c?"+"+m.c+"🥕":"")+"</span>";
      d.title = has?("Milestone LV "+lvl):("Reach LV "+lvl);
      bb.appendChild(d);
    }
    const pp = document.getElementById("pfPups"); pp.innerHTML="";
    for(const p of POWERUPS){
      const d = document.createElement("div");
      d.style.cssText="background:#0a0518;border:1px solid "+p.col+"55;padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:1px;color:#cfc7e6";
      d.innerHTML = '<span style="display:inline-block;width:12px;height:12px;background:'+p.col+'"></span>'
        +'<b style="color:'+p.col+';text-transform:uppercase">'+p.name+'</b>'
        +(p.dur?'<span style="margin-left:auto;color:#8f83b0">'+p.dur+'s</span>':'');
      pp.appendChild(d);
    }
  }
  document.getElementById("pfPrestigeBtn").onclick = ()=>{
    if(PROG.lvl<100) return;
    PROG.prestige++; PROG.lvl=1; PROG.xp=0;
    const bonus = 200 + PROG.prestige*100;
    carrotBank += bonus; saveAll(); cEl.textContent = carrotBank;
    const t = "Prestige "+PROG.prestige;
    if(!PROG.titles.includes(t)) PROG.titles.push(t);
    PROG.activeTitle = t; saveProg();
    toast("PRESTIGE ✦ +"+bonus+"🥕"); levelUpToast("PRESTIGE ✦ "+PROG.prestige);
    renderProfile();
  };

  // ---------- Keyboard: F opens profile, avoid triggering inside inputs ----------
  addEventListener("keydown", (e)=>{
    if(document.activeElement && document.activeElement.tagName==="INPUT") return;
    if(e.code==="KeyF"){ e.preventDefault(); toggleProfile(); }
    // Jump stat tracking (only on ground jumps)
    if((e.code==="Space"||e.code==="ArrowUp") && state===S_PLAY && bunny && bunny.onGround){
      PROG.stats.jumps++;
    }
  });
  cvs.addEventListener("pointerdown", ()=>{
    if(state===S_PLAY && bunny && bunny.onGround) PROG.stats.jumps++;
  });

  // ---------- Daily check on load ----------
  checkDaily();

  // ---------- initial render (in case user opens shop soon) ----------
  renderShop();
})();
</script>
</body>
</html>
