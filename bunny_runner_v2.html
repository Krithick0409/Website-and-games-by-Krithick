<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Bunny Runner Game</title>
<style>
  :root{
    --bg:#0e1020;
    --ink:#f8f5e6;
    --accent:#ffb84d;
    --accent2:#ff5c8a;
    --shadow:#00000055;
    --r-common:#b8c3d1;
    --r-uncommon:#5fd47a;
    --r-rare:#4aa8ff;
    --r-epic:#c470ff;
    --r-legend:#ffb84d;
    --r-mythic:#ff3b7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#0e1020;
    box-shadow:0 10px 40px #000a, inset 0 0 0 4px #0006;
    max-width:100vw;max-height:100vh;touch-action:none;}
  #hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:14px;font-size:14px;letter-spacing:2px;
    text-shadow:2px 2px 0 var(--shadow);pointer-events:none;
    text-transform:uppercase;}
  #hud b{color:var(--accent)}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:2px;color:#fff8;text-transform:uppercase;
    text-shadow:1px 1px 0 var(--shadow);pointer-events:none;}

  /* ---------- Shop overlay ---------- */
  #shop{position:fixed;inset:0;background:radial-gradient(ellipse at center,#12081e 0%,#05030a 100%);
    display:none;flex-direction:column;z-index:20;padding:14px 16px;color:#f8f5e6;
    font-family:ui-monospace,monospace;letter-spacing:1px;
    animation:fadeIn .25s ease-out;}
  #shop.open{display:flex}
  @keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  @keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  #shopHead{display:flex;align-items:center;gap:12px;padding-bottom:10px;
    border-bottom:1px solid #ffffff22;flex-wrap:wrap}
  #shopHead h1{font-size:18px;margin:0;letter-spacing:3px;color:var(--accent);
    text-shadow:2px 2px 0 #000}
  #shopHead .bal{margin-left:auto;font-size:14px;color:#ffb066;letter-spacing:2px}
  #shopHead .bal b{color:var(--accent);font-weight:700}
  #shopHead button.close{background:#2a0f24;border:1px solid var(--accent2);color:#fff;
    padding:6px 12px;cursor:pointer;font-family:inherit;letter-spacing:2px;
    text-transform:uppercase;font-size:11px;transition:.15s}
  #shopHead button.close:hover{background:var(--accent2);color:#1a0f2a}
  #shopTools{display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid #ffffff11}
  #shopTools input[type=text]{flex:1;min-width:120px;background:#0a0616;
    border:1px solid #ffffff22;color:#fff;padding:6px 10px;font-family:inherit;
    font-size:12px;letter-spacing:1px;outline:none;transition:.15s}
  #shopTools input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #ffb84d33}
  #shopTools select{background:#0a0616;border:1px solid #ffffff22;color:#fff;
    padding:6px 8px;font-family:inherit;font-size:11px;letter-spacing:1px;outline:none;cursor:pointer}
  .chip{background:#160b28;border:1px solid #ffffff22;color:#cfc7e6;
    padding:5px 10px;cursor:pointer;font-family:inherit;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;transition:.15s}
  .chip:hover{border-color:var(--accent);color:#fff;transform:translateY(-1px)}
  .chip.on{background:#2a1650;border-color:var(--accent);color:#fff;
    box-shadow:0 0 10px #ffb84d55}
  .chip[data-r=common].on{border-color:var(--r-common);box-shadow:0 0 8px #b8c3d155}
  .chip[data-r=uncommon].on{border-color:var(--r-uncommon);box-shadow:0 0 8px #5fd47a55}
  .chip[data-r=rare].on{border-color:var(--r-rare);box-shadow:0 0 8px #4aa8ff55}
  .chip[data-r=epic].on{border-color:var(--r-epic);box-shadow:0 0 8px #c470ff55}
  .chip[data-r=legend].on{border-color:var(--r-legend);box-shadow:0 0 8px #ffb84d55}
  .chip[data-r=mythic].on{border-color:var(--r-mythic);box-shadow:0 0 8px #ff3b7a55}

  #shopBody{flex:1;display:grid;grid-template-columns:1fr 260px;gap:14px;
    padding-top:12px;overflow:hidden;min-height:0}
  #shopGrid{overflow-y:auto;overflow-x:hidden;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;padding-right:6px;align-content:start}
  #shopGrid::-webkit-scrollbar{width:8px}
  #shopGrid::-webkit-scrollbar-thumb{background:#ffb84d55;border-radius:4px}
  .card{background:#0f0820;border:2px solid #ffffff22;padding:8px;cursor:pointer;
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .18s ease,border-color .18s,box-shadow .18s;
    animation:cardIn .25s ease-out both;overflow:hidden}
  .card:hover{transform:translateY(-3px) scale(1.02);z-index:2}
  .card.sel{outline:2px solid #fff;outline-offset:-2px}
  .card.equipped{background:linear-gradient(180deg,#3a2410,#0f0820)}
  .card[data-r=common]{border-color:var(--r-common)}
  .card[data-r=uncommon]{border-color:var(--r-uncommon);box-shadow:0 0 0 0 #5fd47a00}
  .card[data-r=uncommon]:hover{box-shadow:0 4px 16px #5fd47a55}
  .card[data-r=rare]{border-color:var(--r-rare)}
  .card[data-r=rare]:hover{box-shadow:0 4px 16px #4aa8ff66}
  .card[data-r=epic]{border-color:var(--r-epic)}
  .card[data-r=epic]:hover{box-shadow:0 4px 18px #c470ff77}
  .card[data-r=legend]{border-color:var(--r-legend)}
  .card[data-r=legend]:hover{box-shadow:0 4px 22px #ffb84d88}
  .card[data-r=legend]::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,transparent 30%,#ffe9a833 50%,transparent 70%);
    background-size:200% 100%;animation:shimmer 3s linear infinite;opacity:.5}
  .card[data-r=mythic]{border-color:var(--r-mythic)}
  .card[data-r=mythic]:hover{box-shadow:0 4px 26px #ff3b7aaa}
  .card[data-r=mythic]::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,transparent 30%,#ff3b7a55 50%,transparent 70%);
    background-size:200% 100%;animation:shimmer 2s linear infinite}
  .card canvas{width:64px;height:64px;image-rendering:pixelated;
    background:radial-gradient(ellipse at 50% 70%,#00000055,transparent 70%)}
  .card .nm{font-size:9px;letter-spacing:1px;text-align:center;line-height:1.1;
    color:#fff;text-transform:uppercase;min-height:20px}
  .card .rr{font-size:7px;letter-spacing:2px;opacity:.9}
  .card[data-r=common] .rr{color:var(--r-common)}
  .card[data-r=uncommon] .rr{color:var(--r-uncommon)}
  .card[data-r=rare] .rr{color:var(--r-rare)}
  .card[data-r=epic] .rr{color:var(--r-epic)}
  .card[data-r=legend] .rr{color:var(--r-legend)}
  .card[data-r=mythic] .rr{color:var(--r-mythic)}
  .card .pr{font-size:9px;letter-spacing:1px;color:#ffb066;margin-top:2px}
  .card .pr.owned{color:#7ad48a}
  .card .pr.equip{color:var(--accent)}
  .card .lock{position:absolute;inset:0;background:#000000aa;display:flex;
    align-items:center;justify-content:center;font-size:16px;pointer-events:none;
    opacity:0;transition:opacity .2s}
  .card.locked:hover .lock{opacity:1}
  .card .eqBadge{position:absolute;top:4px;right:4px;background:var(--accent);
    color:#1a0f2a;font-size:7px;padding:2px 4px;letter-spacing:1px;font-weight:700}
  .card .unlockRing{position:absolute;left:50%;top:40%;width:60px;height:60px;
    margin-left:-30px;margin-top:-30px;border-radius:50%;border:3px solid var(--accent);
    pointer-events:none;animation:ring .8s ease-out;opacity:0}

  #shopPreview{background:#0a0518;border:2px solid #ffffff22;padding:12px;
    display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
  #shopPreview .pvStage{background:linear-gradient(180deg,#1a1030 0%,#0a0518 100%);
    border:1px solid #ffffff11;padding:10px;display:flex;justify-content:center;
    align-items:center;height:120px;position:relative;overflow:hidden}
  #shopPreview canvas{width:160px;height:100px;image-rendering:pixelated}
  #shopPreview .pvName{font-size:12px;letter-spacing:2px;color:#fff;text-transform:uppercase;
    text-align:center;line-height:1.2}
  #shopPreview .pvRare{font-size:9px;letter-spacing:3px;text-align:center;text-transform:uppercase}
  #shopPreview .pvDesc{font-size:10px;letter-spacing:1px;color:#cfc7e6;line-height:1.4;
    background:#000000aa;padding:6px 8px;border-left:2px solid var(--accent)}
  #shopPreview .pvRow{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:1px;color:#a89ecf;padding:2px 0;border-bottom:1px dotted #ffffff11}
  #shopPreview .pvRow b{color:#fff}
  #shopPreview .pvAnim{display:flex;gap:6px;justify-content:center;margin-top:4px}
  #shopPreview .pvAnim div{flex:1;background:#0f0820;border:1px solid #ffffff11;
    padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
  #shopPreview .pvAnim canvas{width:48px;height:48px}
  #shopPreview .pvAnim span{font-size:7px;letter-spacing:1px;color:#8f83b0;text-transform:uppercase}
  #shopPreview .pvBtn{margin-top:auto;padding:10px;text-align:center;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;
    border:1px solid transparent;transition:.15s;color:#fff}
  #shopPreview .pvBtn.buy{background:var(--accent2);border-color:var(--accent2);color:#1a0f2a;font-weight:700}
  #shopPreview .pvBtn.buy:hover{filter:brightness(1.1);transform:translateY(-1px)}
  #shopPreview .pvBtn.buy.no{background:#3a1a2a;border-color:#5a2a3a;color:#a88;cursor:not-allowed}
  #shopPreview .pvBtn.equip{background:#2a4a30;border-color:var(--r-uncommon);color:#fff}
  #shopPreview .pvBtn.equip:hover{background:var(--r-uncommon);color:#0a0518}
  #shopPreview .pvBtn.equipped{background:transparent;border-color:var(--accent);color:var(--accent);cursor:default}

  #confirm{position:fixed;inset:0;background:#000000cc;display:none;
    align-items:center;justify-content:center;z-index:30;animation:fadeIn .2s}
  #confirm.open{display:flex}
  #confirm .box{background:#12081e;border:2px solid var(--accent);padding:20px 24px;
    text-align:center;max-width:320px;animation:pop .3s ease-out}
  #confirm h2{margin:0 0 8px;color:var(--accent);letter-spacing:3px;font-size:14px}
  #confirm p{margin:8px 0;font-size:11px;letter-spacing:1px;color:#cfc7e6;line-height:1.4}
  #confirm p b{color:#fff}
  #confirm .row{display:flex;gap:10px;margin-top:14px;justify-content:center}
  #confirm button{padding:8px 14px;font-family:inherit;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:1px solid;transition:.15s}
  #confirm button.ok{background:var(--accent2);border-color:var(--accent2);color:#1a0f2a}
  #confirm button.ok:hover{filter:brightness(1.15)}
  #confirm button.no{background:transparent;border-color:#ffffff33;color:#cfc7e6}
  #confirm button.no:hover{border-color:#fff;color:#fff}

  #toastEl{position:fixed;top:50px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#1a0f2a;padding:10px 18px;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;font-weight:700;z-index:40;
    display:none;animation:pop .3s ease-out}
  #toastEl.show{display:block}

  @media (max-width:700px){
    #shopBody{grid-template-columns:1fr}
    #shopPreview{max-height:200px}
    #shopGrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }
</style>

<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span><span>🥕 <b id="c">0</b></span></div>
<div id="hint">Space / ↑ / Tap — Jump &nbsp;·&nbsp; P — Pause &nbsp;·&nbsp; R — Restart &nbsp;·&nbsp; M — Mute &nbsp;·&nbsp; S — Shop</div>

<div id="shop" aria-hidden="true">
  <div id="shopHead">
    <h1>SKIN VAULT</h1>
    <span style="font-size:10px;letter-spacing:2px;color:#8f83b0">50+ HANDCRAFTED BUNNIES</span>
    <span class="bal">🥕 BALANCE: <b id="shopBal">0</b></span>
    <button class="close" id="closeShop">CLOSE  ✕</button>
  </div>
  <div id="shopTools">
    <input type="text" id="shopSearch" placeholder="SEARCH SKINS..." autocomplete="off"/>
    <div id="filterChips" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="chip on" data-r="all">ALL</button>
      <button class="chip" data-r="common">COMMON</button>
      <button class="chip" data-r="uncommon">UNCOMMON</button>
      <button class="chip" data-r="rare">RARE</button>
      <button class="chip" data-r="epic">EPIC</button>
      <button class="chip" data-r="legend">LEGENDARY</button>
      <button class="chip" data-r="mythic">MYTHIC</button>
    </div>
    <select id="shopSort" title="Sort">
      <option value="rarity">SORT: RARITY</option>
      <option value="priceAsc">SORT: PRICE ↑</option>
      <option value="priceDesc">SORT: PRICE ↓</option>
      <option value="name">SORT: NAME</option>
      <option value="owned">SORT: OWNED</option>
    </select>
  </div>
  <div id="shopBody">
    <div id="shopGrid"></div>
    <div id="shopPreview">
      <div class="pvStage"><canvas id="pvCanvas" width="80" height="50"></canvas></div>
      <div class="pvName" id="pvName">—</div>
      <div class="pvRare" id="pvRare">—</div>
      <div class="pvDesc" id="pvDesc">Select a skin to preview.</div>
      <div class="pvRow"><span>ACCESSORY</span><b id="pvAcc">—</b></div>
      <div class="pvRow"><span>TRAIL</span><b id="pvTrail">—</b></div>
      <div class="pvRow"><span>TRAIT</span><b id="pvTrait">—</b></div>
      <div class="pvAnim">
        <div><canvas id="pvIdle" width="24" height="24"></canvas><span>IDLE</span></div>
        <div><canvas id="pvRun" width="24" height="24"></canvas><span>RUN</span></div>
        <div><canvas id="pvJump" width="24" height="24"></canvas><span>JUMP</span></div>
      </div>
      <button class="pvBtn buy" id="pvBtn">SELECT A SKIN</button>
    </div>
  </div>
</div>

<div id="confirm">
  <div class="box">
    <h2>CONFIRM PURCHASE</h2>
    <p>Unlock <b id="cfName">—</b>?</p>
    <p>Cost: <b id="cfCost">0</b> 🥕 &nbsp;·&nbsp; Balance after: <b id="cfAfter">0</b> 🥕</p>
    <div class="row">
      <button class="no" id="cfNo">CANCEL</button>
      <button class="ok" id="cfOk">UNLOCK</button>
    </div>
  </div>
</div>

<div id="toastEl"></div>

<script>
(() => {
  "use strict";
  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const W = cvs.width, H = cvs.height;
  const GROUND_Y = H - 44;
  const sEl = document.getElementById("s");
  const bEl = document.getElementById("b");
  const cEl = document.getElementById("c");

  function fit(){
    const scale = Math.max(1, Math.min(Math.floor(innerWidth / W), Math.floor(innerHeight / H)));
    cvs.style.width = (W*scale)+"px";
    cvs.style.height = (H*scale)+"px";
  }
  addEventListener("resize", fit); fit();

  // ---------- Audio ----------
  let AC = null, muted = false;
  function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq, dur=0.08, type="square", vol=0.06, slide=0){
    if(muted) return;
    const a = ac(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  const snd = {
    jump:()=>beep(520,0.08,"square",0.05,240),
    djump:()=>beep(700,0.09,"square",0.05,300),
    land:()=>beep(180,0.05,"sine",0.04),
    carrot:()=>{ beep(880,0.06,"triangle",0.06,220); setTimeout(()=>beep(1320,0.08,"triangle",0.05,0),60);},
    hit:()=>beep(120,0.25,"sawtooth",0.09,-80),
    shield:()=>beep(300,0.15,"sine",0.08,600),
    buy:()=>{ beep(660,0.08,"square",0.06); setTimeout(()=>beep(990,0.09,"square",0.06),80); setTimeout(()=>beep(1320,0.14,"square",0.06),160);},
    equip:()=>{ beep(520,0.06,"triangle",0.05); setTimeout(()=>beep(780,0.09,"triangle",0.05),60);},
    deny:()=>beep(160,0.15,"sawtooth",0.06,-40),
    start:()=>{ beep(440,0.08,"square",0.05); setTimeout(()=>beep(660,0.1,"square",0.05),90);},
    tick:()=>beep(1200,0.02,"square",0.03),
  };

  // ---------- Pixel helpers ----------
  function drawArt(g, rows, palette, dx, dy, scale=1){
    for(let y=0;y<rows.length;y++){
      const row = rows[y];
      for(let x=0;x<row.length;x++){
        const ch = row[x];
        if(ch==='.'||ch===' ') continue;
        const c = palette[ch]; if(!c) continue;
        g.fillStyle = c;
        g.fillRect((dx+x*scale)|0,(dy+y*scale)|0,scale,scale);
      }
    }
  }

  // ---------- Bunny sprite frames (16x16) ----------
  const BUNNY_A = [
    "....BB......BB..",
    "...BTB......BTB.",
    "...BTB......BTB.",
    "...BBB......BBB.",
    "....BBBBBBBBBB..",
    "...BBBBBBBBBBBB.",
    "..BBBEBBBBBEBBB.",
    "..BBBBBBBNBBBBBB",
    "..BBBBBAAABBBBBB",
    "..BTBBBBBBBBBBT.",
    "..BTTBBBBBBBBTT.",
    "...BBBBBBBBBBBB.",
    "....BBB....BBB..",
    "...BBBB....BBBB.",
    "...BTTB....BTTB.",
    "................",
  ];
  const BUNNY_B = [
    "....BB......BB..",
    "...BTB......BTB.",
    "...BTB......BTB.",
    "...BBB......BBB.",
    "....BBBBBBBBBB..",
    "...BBBBBBBBBBBB.",
    "..BBBEBBBBBEBBB.",
    "..BBBBBBBNBBBBBB",
    "..BBBBBAAABBBBBB",
    "..BBBBBBBBBBBBBB",
    "...BBBBBBBBBBBB.",
    "..BBB........BBB",
    ".BTTB........BTT",
    "BTT............T",
    "................",
    "................",
  ];
  const BUNNY_JUMP = [
    "....BB......BB..",
    "...BTB......BTB.",
    "...BTB......BTB.",
    "...BBB......BBB.",
    "....BBBBBBBBBB..",
    "...BBBBBBBBBBBB.",
    "..BBBEBBBBBEBBB.",
    "..BBBBBBBNBBBBBB",
    "..BBBBBAAABBBBBB",
    "...BBBBBBBBBBBB.",
    "....BBBBBBBBBB..",
    "....BBB....BBB..",
    "....BTB....BTB..",
    "................",
    "................",
    "................",
  ];
  const BUNNY_IDLE = [ // subtle: ears slightly relaxed
    "....BB......BB..",
    "....BB......BB..",
    "...BTB......BTB.",
    "...BBB......BBB.",
    "....BBBBBBBBBB..",
    "...BBBBBBBBBBBB.",
    "..BBBEBBBBBEBBB.",
    "..BBBBBBBNBBBBBB",
    "..BBBBBAAABBBBBB",
    "...BBBBBBBBBBBB.",
    "..BBBBBBBBBBBBB.",
    "..BTB........BTB",
    "..BTB........BTB",
    "..BBB........BBB",
    "................",
    "................",
  ];

  // ---------- Skins (60 total, cap 750 carrots) ----------
  const RARITY = {
    common:  { name:"COMMON",    color:"#b8c3d1", rank:0 },

  function drawAcc(g, sk, dx, dy){
    const a = sk.acc, pal = sk.pal;
    switch(a){
      case "glasses":
        g.fillStyle = sk.pal.A;
        g.fillRect(dx+3, dy+6, 10, 2);
        g.fillStyle = sk.pal.E;
        g.fillRect(dx+4, dy+7, 2, 1); g.fillRect(dx+10, dy+7, 2, 1);
        break;
      case "monocle":
        g.strokeStyle = "#ffe27a"; g.lineWidth=1;
        g.strokeRect(dx+9.5, dy+5.5, 4, 4);
        g.fillStyle = "#ffe27a"; g.fillRect(dx+13, dy+9, 1, 2);
        break;
      case "bow":
        g.fillStyle = "#ff3b7a";
        g.fillRect(dx+2, dy-1, 2, 2); g.fillRect(dx+6, dy-1, 2, 2);
        g.fillRect(dx+3, dy, 4, 1);
        g.fillStyle = "#ffb0c4"; g.fillRect(dx+4, dy, 2, 1);
        break;
      case "crown":
        g.fillStyle = "#ffd94a";
        g.fillRect(dx+3, dy-2, 10, 2);
        g.fillRect(dx+3, dy-4, 2, 2); g.fillRect(dx+7, dy-4, 2, 2); g.fillRect(dx+11, dy-4, 2, 2);
        g.fillStyle = "#ff3b7a"; g.fillRect(dx+7, dy-1, 2, 1);
        g.fillStyle = "#4aa8ff"; g.fillRect(dx+3, dy-1, 1, 1); g.fillRect(dx+12, dy-1, 1, 1);
        break;
      case "hat": // wizard/witch/chef/pirate style
        if(sk.id==="chef"){
          g.fillStyle="#fdfdfd";
          g.fillRect(dx+3,dy-1,10,2); g.fillRect(dx+4,dy-4,8,3);
          g.fillRect(dx+3,dy-6,3,3); g.fillRect(dx+7,dy-7,3,3); g.fillRect(dx+11,dy-6,3,3);
        } else if(sk.id==="pirate"){
          g.fillStyle="#20222a";
          g.fillRect(dx+1,dy-1,14,2);
          g.fillRect(dx+3,dy-4,10,3);
          g.fillStyle="#ffe27a"; g.fillRect(dx+7,dy-3,2,2);

  const stars = Array.from({length:60},()=>({x:Math.random()*W, y:Math.random()*(H-90), t:Math.random()*Math.PI*2}));
  function makeMountains(color, seed, height){
    const c = document.createElement("canvas");
    c.width = W*2; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = color;
    let x=0, r = seed;
    const rand = ()=>{ r=(r*9301+49297)%233280; return r/233280; };
    while(x < W*2){
      const w = 40 + rand()*70|0;
      const h = height*0.6 + rand()*height*0.4|0;
      const cx = x + w/2;
      g.beginPath(); g.moveTo(x, GROUND_Y);
      g.lineTo(cx, GROUND_Y - h); g.lineTo(x + w, GROUND_Y);
      g.closePath(); g.fill();
      g.fillStyle = "#ffffff22";
      g.beginPath(); g.moveTo(cx, GROUND_Y-h);
      g.lineTo(cx-6, GROUND_Y-h+10); g.lineTo(cx+6, GROUND_Y-h+10);
      g.closePath(); g.fill();
      g.fillStyle = color; x += w - 10;
    }
    return c;
  }

  // ---------- Input ----------
  function tryJump(){
    if(state===S_MENU){ state=S_PLAY; reset(); snd.start(); return; }
    if(state===S_OVER){ reset(); state=S_PLAY; snd.start(); return; }
    if(state===S_PAUSE){ state=S_PLAY; return; }
    if(state===S_SHOP){ return; }
    if(state===S_PLAY){
      const traits = equippedSkin().traits||{};
      const hj = traits.highJump || 1;
      const canGround = bunny.onGround || coyoteT>0;
      if(canGround){ bunny.vy=-235*hj; bunny.onGround=false; coyoteT=0; jumpsUsed=1; snd.jump(); }
      else if(jumpsUsed<maxJumps){ bunny.vy=-215*hj; jumpsUsed++; snd.djump(); burst(bunny.x+6, bunny.y+16, "#ffffff",6); }
    }
  }
  function tryAbility(){
    if(state!==S_PLAY || !abilityKind || abilityCd>0.001) return;
    triggerAbility(abilityKind, abilityData);
    abilityCd = abilityMax;
  }
  function togglePause(){ if(state===S_PLAY) state=S_PAUSE; else if(state===S_PAUSE) state=S_PLAY; }
  function openShop(){

      return;
    }
    if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); input.hold=true; tryJump(); }
    else if(e.code==="KeyP"){ togglePause(); }
    else if(e.code==="KeyR"){ reset(); state=S_PLAY; snd.start(); }
    else if(e.code==="KeyM"){ muted=!muted; }
    else if(e.code==="KeyS"){ openShop(); }
    else if(e.code==="KeyE"||e.code==="ShiftLeft"||e.code==="ShiftRight"){ e.preventDefault(); tryAbility(); }

  addEventListener("keyup",(e)=>{ if(e.code==="Space"||e.code==="ArrowUp") input.hold=false; });
  cvs.addEventListener("pointerdown",(e)=>{

      const px = (e.clientX - r.left) * (W/r.width);
      const py = (e.clientY - r.top ) * (H/r.height);
      if(state===S_MENU && px>=W/2-40 && px<=W/2+40 && py>=190 && py<=204){ openShop(); return; }
    }

  // ---------- Spawn / particles ----------
  function spawnFire(){ const h=18; obstacles.push({x:W+8,y:GROUND_Y-h,w:12,h,t:Math.random()*10}); }
  function spawnCarrot(){ const y = GROUND_Y-24-(Math.random()<0.4?30:0); carrots.push({x:W+8,y,w:10,h:12,t:Math.random()*10,taken:false}); }
  function burst(x,y,color,n=8){
    for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*90,vy:-Math.random()*80-20,life:.5+Math.random()*.3,c:color,size:2,kind:"burst"});
  }

  // ---------- Update ----------
  function update(dt){
    if(dnTrans<1) dnTrans = Math.min(1, dnTrans + dt/1.5);
    if(state!==S_PLAY) return;
    const sk = equippedSkin();
    const traits = sk.traits||{};

    // Ability cooldown ticks in real time
    if(abilityCd>0) abilityCd = Math.max(0, abilityCd - dt);
    // World-time modifier (time warp)
    if(worldTimeT>0){ worldTimeT -= dt; if(worldTimeT<=0) worldTimeMul=1; }
    const wdt = dt * worldTimeMul;

    // Invincibility / phoenix fx timers
    if(invincibleT>0) invincibleT -= dt;
    if(phoenixFxT>0) phoenixFxT -= dt;
    if(rainbowT>0) rainbowT -= dt;
    if(ghostT>0) ghostT -= dt;
    if(freezeT>0) freezeT -= dt;
    if(flashT>0) flashT -= dt;
    if(screenShake>0) screenShake -= dt;
    if(luckyStartT>0) luckyStartT -= dt;

    speed += 4*dt; distance += speed*dt;
    const scoreMul = traits.scoreBonus||1;
    const prevScore = score; score += 3*dt*scoreMul;
    scoreCarrotAcc += (score-prevScore);
    const per = traits.fortune||1;
    while(scoreCarrotAcc>=25){ scoreCarrotAcc-=25; carrotBank += per; }

    // Passive carrot rain
    if(traits.carrotRain){
      carrotRainT -= dt;
      if(carrotRainT<=0){ carrotRainT = traits.carrotRain; carrots.push({x:W+8,y:GROUND_Y-70,w:10,h:12,t:0,taken:false,drop:true}); }
    }
    // Passive auto burn
    if(traits.autoBurn){
      autoBurnT -= dt;
      if(autoBurnT<=0 && obstacles.length){
        autoBurnT = traits.autoBurn;
        // burn nearest ahead
        let idx=-1, best=1e9;
        for(let i=0;i<obstacles.length;i++){ const o=obstacles[i]; if(o.x>bunny.x-10 && o.x<best){ best=o.x; idx=i; } }
        if(idx>=0){ const o=obstacles[idx]; burst(o.x+o.w/2,o.y+o.h/2,"#ffb84d",22); obstacles.splice(idx,1); snd.shield(); }
      }
    }

    const bucket = Math.floor(score/200);
    if(bucket>lastCycleBucket){ lastCycleBucket=bucket; dnTarget = dnTarget===1?0:1; dnTrans=0; }
    dayNight += (dnTarget-dayNight) * Math.min(1, dt/0.75);

    const gravMul = traits.lowGrav||1;
    let gravFactor = gravMul;
    if(traits.floatFall && bunny.vy>0 && (input.hold)) gravFactor *= traits.floatFall;
    bunny.vy += 720*dt*gravFactor; bunny.y += bunny.vy*dt;
    if(bunny.y>=GROUND_Y-bunny.h){
      if(!bunny.onGround) snd.land();
      bunny.y = GROUND_Y-bunny.h; bunny.vy=0; bunny.onGround=true; jumpsUsed=0;
      coyoteT = traits.coyoteMs||0;
    } else if(bunny.onGround){
      bunny.onGround=false;
    } else if(coyoteT>0){ coyoteT -= dt; }
    bunny.animT += dt;

    // Trail
    trailEmit(sk, particles, bunny.x+2, bunny.y+bunny.h-2, true);
    if(rainbowT>0) trailEmit({trail:"rainbow"}, particles, bunny.x+2, bunny.y+bunny.h-2, true);
    if(ghostT>0){
      particles.push({x:bunny.x+6,y:bunny.y+8,vx:0,vy:0,life:0.35,c:"rgba(196,112,255,0.6)",size:10,kind:"ghost"});
    }

    scrollFar = (scrollFar+speed*0.15*wdt)%W;
    scrollNear = (scrollNear+speed*0.35*wdt)%W;
    scrollGround = (scrollGround+speed*wdt)%W;

    if(luckyStartT<=0){
      spawnT -= dt;
      if(spawnT<=0){ spawnFire(); spawnT = Math.max(0.75, 1.7-speed*0.004) + Math.random()*0.8; }
    }
    carrotT -= dt;
    if(carrotT<=0){ spawnCarrot(); carrotT = 1.4+Math.random()*1.6; }

    const magnetR = (abilityKind==="magnetPulse" && abilityCd>abilityMax-1.5)?250:(traits.magnet||0);
    const obsMove = (freezeT>0)?0:speed*wdt;
    for(const o of obstacles){ o.x -= obsMove; o.t += wdt*10; }
    for(const c of carrots){
      c.x -= speed*wdt; c.t += wdt*4;
      if(c.drop) c.y += 30*dt;
      if(magnetR){
        const bcx=bunny.x+6, bcy=bunny.y+8;
        const dx=bcx-(c.x+5), dy=bcy-(c.y+6);
        const d2=dx*dx+dy*dy, R=magnetR;
        if(d2<R*R){ const d=Math.sqrt(d2)||1, pull=(magnetR>150?520:140)*dt; c.x+=dx/d*pull; c.y+=dy/d*pull; }
      }
    }
    obstacles = obstacles.filter(o=>o.x+o.w>-4);
    carrots = carrots.filter(c=>c.x+c.w>-4 && !c.taken);

    for(const p of particles){ p.vy += (p.kind==="bubble"?-40:(p.kind==="ghost"?0:300))*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    particles = particles.filter(p=>p.life>0);
    for(const p of fxParticles){ p.vx*=0.98; p.vy+=(p.g||60)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    fxParticles = fxParticles.filter(p=>p.life>0);

    // Collision
    const hbMul = traits.smallHitbox||1;
    const inset = (1-hbMul)*6;
    const bx=bunny.x+2+inset, by=bunny.y+2+inset, bw=(bunny.w-4)*hbMul, bh=(bunny.h-4)*hbMul;
    const fireMul = traits.fireShrink||1;
    if(invincibleT<=0 && rainbowT<=0 && ghostT<=0){
      for(let i=0;i<obstacles.length;i++){
        const o=obstacles[i];
        const oInset=(1-fireMul)*3;
        const ox=o.x+2+oInset, oy=o.y+3+oInset, ow=(o.w-4)*fireMul, oh=(o.h-4)*fireMul;
        if(bx<ox+ow && bx+bw>ox && by<oy+oh && by+bh>oy){
          if(shieldCount>0){
            shieldCount--; snd.shield(); burst(bunny.x+6,bunny.y+8,"#8ad8ff",14);
            obstacles.splice(i,1); break;
          }
          if(phoenixCharge){
            phoenixCharge=false; invincibleT=2; phoenixFxT=2; flashT=0.4; flashCol=[255,180,60]; screenShake=0.4;
            for(let k=0;k<40;k++) fxParticles.push({x:bunny.x+6,y:bunny.y+8,vx:(Math.random()-0.5)*260,vy:-Math.random()*200-40,life:0.9+Math.random()*0.4,c:"#ff8b28",size:3,g:200});
            snd.shield(); obstacles.splice(i,1); break;
          }
          snd.hit(); burst(bunny.x+6,bunny.y+8,"#ff5c8a",16);
          state=S_OVER; if(score>best) best=Math.floor(score); saveAll(); break;
        }
      }
    }
    for(const c of carrots){
      if(c.taken) continue;
      if(bx<c.x+c.w && bx+bw>c.x && by<c.y+c.h && by+bh>c.y){
        c.taken=true; carrotCount++; carrotBank++; score+=25; snd.carrot();
        burst(c.x+5,c.y+6,"#ff8b28",10);
        if(traits.carrotHeal){
          carrotHealAcc++;
          if(carrotHealAcc>=traits.carrotHeal){ carrotHealAcc=0; if(shieldCount<1){ shieldCount=1; snd.shield(); } }
        }
      }
    }
    sEl.textContent = Math.floor(score);
    bEl.textContent = Math.max(best, Math.floor(score));
    cEl.textContent = carrotBank;
  }

  // ---------- Active abilities ----------
  const input = { hold:false };
  function triggerAbility(kind, data){
    const b = bunny;
    if(kind==="timeWarp"){
      worldTimeMul = 0.25; worldTimeT = data.dur; flashT=0.25; flashCol=[196,112,255];
      for(let k=0;k<24;k++) fxParticles.push({x:b.x+6,y:b.y+8,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*180,life:0.8,c:"#c470ff",size:2,g:0});
    } else if(kind==="thunder"){
      const count = data.count||3;
      const list = obstacles.slice().sort((a,b2)=>a.x-b2.x).slice(0,count);
      for(const o of list){
        const idx=obstacles.indexOf(o); if(idx>=0) obstacles.splice(idx,1);
        for(let k=0;k<14;k++) fxParticles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*180,vy:-Math.random()*160,life:0.7,c:data.fx==="fire"?"#ff8b28":"#ffe27a",size:3,g:120});
      }
      flashT=0.3; flashCol=data.fx==="fire"?[255,140,60]:[255,240,140]; screenShake=0.3; snd.hit();
    } else if(kind==="void"){
      invincibleT = data.dur; ghostT = data.dur; flashT=0.2; flashCol=[196,112,255];
    } else if(kind==="dashStrike"){
      const dist = data.dist||70;
      // destroy fires in path
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i];
        if(o.x>b.x-4 && o.x<b.x+dist+16){
          for(let k=0;k<10;k++) fxParticles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*220,vy:-Math.random()*180,life:0.6,c:"#ff8b28",size:3,g:150});
          obstacles.splice(i,1);
        }
      }
      // trail line
      for(let k=0;k<24;k++) fxParticles.push({x:b.x+6+Math.random()*dist,y:b.y+6+Math.random()*8,vx:0,vy:0,life:0.4,c:"#ffe27a",size:2,g:0});
      b.x = Math.min(b.x+dist, W-40); invincibleT=Math.max(invincibleT,0.4);
    } else if(kind==="nature"){
      for(const c of carrots){ c.taken=true; carrotCount++; carrotBank++; score+=25; burst(c.x+5,c.y+6,"#7bff9a",8); }
      carrots.length=0; flashT=0.25; flashCol=[123,255,154]; snd.carrot();
    } else if(kind==="freeze"){
      freezeT = data.dur; flashT=0.25; flashCol=[170,220,255];
      for(let k=0;k<30;k++) fxParticles.push({x:Math.random()*W,y:Math.random()*H*0.6,vx:0,vy:20+Math.random()*40,life:1,c:"#cfeaff",size:2,g:0});
    } else if(kind==="solarBurst"){
      for(const o of obstacles) for(let k=0;k<8;k++) fxParticles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*240,vy:-Math.random()*220,life:0.9,c:"#ffe27a",size:3,g:120});
      obstacles.length=0; flashT=0.5; flashCol=[255,240,180]; screenShake=0.5; invincibleT=Math.max(invincibleT,0.6); snd.hit();
    } else if(kind==="magnetPulse"){
      // handled in update via cooldown window
      flashT=0.2; flashCol=[0,240,255];
    } else if(kind==="blink"){
      b.x = Math.min(b.x + (data.dist||90), W-40); invincibleT = Math.max(invincibleT, 0.3);
      for(let k=0;k<18;k++) fxParticles.push({x:b.x-Math.random()*(data.dist||90),y:b.y+Math.random()*b.h,vx:0,vy:0,life:0.35,c:"#c470ff",size:2,g:0});
      flashT=0.2; flashCol=[196,112,255];
    } else if(kind==="shieldRegen"){
      if(shieldCount<3){ shieldCount++; snd.shield(); }
      for(let k=0;k<16;k++) fxParticles.push({x:b.x+6,y:b.y+8,vx:(Math.random()-0.5)*140,vy:-Math.random()*140,life:0.6,c:"#8ad8ff",size:2,g:80});
    } else if(kind==="rainbow"){
      rainbowT = data.dur; invincibleT = Math.max(invincibleT, data.dur); flashT=0.3; flashCol=[255,120,180];
    }
  }

  // ---------- Draw ----------
  function lerpColor(a,b,t){ return [(a[0]+(b[0]-a[0])*t)|0,(a[1]+(b[1]-a[1])*t)|0,(a[2]+(b[2]-a[2])*t)|0]; }
  const NIGHT_TOP=[59,31,92],NIGHT_MID=[27,16,48],NIGHT_BOT=[74,42,61];
  const DAY_TOP=[135,200,235],DAY_MID=[200,225,240],DAY_BOT=[240,220,180];

  function drawBackground(dt){
    const d = dayNight;
    const top = lerpColor(NIGHT_TOP, DAY_TOP, d);
    const mid = lerpColor(NIGHT_MID, DAY_MID, d);
    const bot = lerpColor(NIGHT_BOT, DAY_BOT, d);
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,`rgb(${top[0]},${top[1]},${top[2]})`);
    grd.addColorStop(0.55,`rgb(${mid[0]},${mid[1]},${mid[2]})`);
    grd.addColorStop(1,`rgb(${bot[0]},${bot[1]},${bot[2]})`);
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    const nightAmt = 1-d;
    if(nightAmt>0.02){
      for(const s of stars){
        s.t += dt*2;
        const a = (0.4 + Math.sin(s.t+s.x)*0.4)*nightAmt;
        ctx.fillStyle=`rgba(255,240,200,${a.toFixed(3)})`;
        ctx.fillRect(s.x|0,s.y|0,1,1);
      }
      ctx.globalAlpha=nightAmt;
      ctx.fillStyle="#ffe9a8"; ctx.beginPath(); ctx.arc(W-60,46,14,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=`rgba(${mid[0]},${mid[1]},${mid[2]},0.35)`;
      ctx.beginPath(); ctx.arc(W-56,42,12,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
    if(d>0.02){
      ctx.globalAlpha=d;
      ctx.fillStyle="#ffe27a"; ctx.beginPath(); ctx.arc(W-60,50,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#fff6c8"; ctx.beginPath(); ctx.arc(W-60,50,10,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(255,220,120,0.7)"; ctx.lineWidth=1;
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4+(performance.now()/2000);
        ctx.beginPath(); ctx.moveTo(W-60+Math.cos(a)*20,50+Math.sin(a)*20);
        ctx.lineTo(W-60+Math.cos(a)*26,50+Math.sin(a)*26); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=1-d; ctx.drawImage(mtnFarNight,-scrollFar,0); ctx.drawImage(mtnFarNight,W-scrollFar,0);
    ctx.globalAlpha=d;   ctx.drawImage(mtnFarDay,-scrollFar,0);   ctx.drawImage(mtnFarDay,W-scrollFar,0);
    ctx.globalAlpha=1-d; ctx.drawImage(mtnNearNight,-scrollNear,8); ctx.drawImage(mtnNearNight,W-scrollNear,8);
    ctx.globalAlpha=d;   ctx.drawImage(mtnNearDay,-scrollNear,8);   ctx.drawImage(mtnNearDay,W-scrollNear,8);
    ctx.globalAlpha=1;
    ctx.globalAlpha=1-d; ctx.drawImage(groundNight,-scrollGround,GROUND_Y); ctx.drawImage(groundNight,W-scrollGround,GROUND_Y);
    ctx.globalAlpha=d;   ctx.drawImage(groundDay,-scrollGround,GROUND_Y);   ctx.drawImage(groundDay,W-scrollGround,GROUND_Y);
    ctx.globalAlpha=1;
  }

  function drawBunnyAt(g, skin, x, y, animT, mode){
    // mode: "run","idle","jump"
    let art;
    if(mode==="jump") art=BUNNY_JUMP;
    else if(mode==="idle") art = (Math.floor(animT*2)%2===0)?BUNNY_IDLE:BUNNY_A;
    else art = (Math.floor(animT*12)%2===0)?BUNNY_A:BUNNY_B;
    drawArt(g, art, skin.pal, x, y, 1);
    drawAcc(g, skin, x, y);
  }
  function drawBunny(){
    const sk = equippedSkin();
    const alpha = ghostT>0 ? 0.45 : 1;
    ctx.globalAlpha = alpha;
    if(rainbowT>0){
      const hue = (performance.now()/6)%360;
      ctx.filter = `hue-rotate(${hue}deg) saturate(1.6)`;
    }
    drawBunnyAt(ctx, sk, bunny.x, bunny.y, bunny.animT, bunny.onGround?"run":"jump");
    ctx.filter="none"; ctx.globalAlpha=1;
    // Shields (stacked rings)
    for(let s=0;s<shieldCount;s++){
      const t=performance.now()/300 + s*0.7;
      ctx.strokeStyle=`rgba(140,200,255,${0.6+Math.sin(t)*0.2})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(bunny.x+6,bunny.y+8,12+s*2,0,Math.PI*2); ctx.stroke();
    }
    if(phoenixFxT>0){
      ctx.strokeStyle=`rgba(255,140,60,${0.5+Math.sin(performance.now()/80)*0.3})`;
      ctx.beginPath(); ctx.arc(bunny.x+6,bunny.y+8,14,0,Math.PI*2); ctx.stroke();
    }
    if(bunny.onGround){
      ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fillRect(bunny.x+1,GROUND_Y-1,bunny.w-2,1);
    } else {
      const d=(GROUND_Y-(bunny.y+bunny.h)); const w=Math.max(4,bunny.w-Math.floor(d/4));
      ctx.fillStyle=`rgba(0,0,0,${Math.max(0.1,0.35-d/200)})`;
      ctx.fillRect(bunny.x+(bunny.w-w)/2|0,GROUND_Y-1,w,1);
    }
  }
  function drawFxParticles(){
    for(const p of fxParticles){
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x|0, p.y|0, p.size||2, p.size||2);
    }
    ctx.globalAlpha = 1;
  }

  function drawCarrots(){
    for(const c of carrots){ const bob=Math.sin(c.t*1.5)*1|0; drawArt(ctx, CARROT, CARROT_PAL, c.x, c.y+bob, 1); }

  function drawParticles(){
    for(const p of particles){
      if(p.kind==="burst"){
        ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillRect(p.x|0,p.y|0,2,2); ctx.globalAlpha=1;

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    blink = (blink+dt)%1.2;
    update(dt);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(screenShake>0){
      const s = Math.min(4, screenShake*10);
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    drawBackground(dt);
    drawCarrots(); drawObstacles(); drawBunny(); drawParticles(); drawFxParticles();
    ctx.restore();
    drawScreenFx();
    if(state===S_PLAY) drawAbilityHUD();
    if(state===S_MENU) drawMenu();
    else if(state===S_OVER) drawOver();
    else if(state===S_PAUSE) drawPauseOverlay();
    if(muted) text("MUTED", W-4, 4, 7, "#ff5c8a", "right");
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function accLabel(a){ return (a==="none"?"NONE":a.toUpperCase()); }

  function drawSkinToCanvas(canvas, sk, mode, t){
    const g = canvas.getContext("2d");
    g.imageSmoothingEnabled=false;
    g.clearRect(0,0,canvas.width,canvas.height);
    // Center a 16x16 sprite
    const dx = (canvas.width-16)>>1, dy = (canvas.height-16)>>1;
    // shadow
    g.fillStyle="rgba(0,0,0,0.35)"; g.fillRect(dx+1, dy+16, 14, 1);
    let art;
    if(mode==="jump") art=BUNNY_JUMP;
    else if(mode==="idle") art = (Math.floor(t*2)%2===0)?BUNNY_IDLE:BUNNY_A;
    else art = (Math.floor(t*8)%2===0)?BUNNY_A:BUNNY_B;
    drawArt(g, art, sk.pal, dx, dy, 1);
    drawAcc(g, sk, dx, dy);
  }

  // Card canvas cache
  const cardData = new WeakMap();

  function buildCard(sk){
    const isOwned = owned.includes(sk.id);
    const isEq = equippedId===sk.id;
    const card = document.createElement("div");
    card.className = "card"+(isOwned?"":" locked")+(isEq?" equipped":"")+(selectedId===sk.id?" sel":"");
    card.dataset.r = sk.r; card.dataset.id = sk.id;
    const c = document.createElement("canvas"); c.width=32; c.height=32;
    card.appendChild(c);
    const rr = document.createElement("div"); rr.className="rr"; rr.textContent = RARITY[sk.r].name;
    card.appendChild(rr);
    const nm = document.createElement("div"); nm.className="nm"; nm.textContent = sk.name;
    card.appendChild(nm);
    const pr = document.createElement("div"); pr.className="pr";
    if(isEq){ pr.textContent="EQUIPPED"; pr.classList.add("equip"); }
    else if(isOwned){ pr.textContent="OWNED"; pr.classList.add("owned"); }
    else { pr.textContent = skinPrice(sk)+" 🥕"; }
    card.appendChild(pr);
    if(isEq){ const b=document.createElement("div"); b.className="eqBadge"; b.textContent="★"; card.appendChild(b); }
    if(!isOwned){ const l=document.createElement("div"); l.className="lock"; l.textContent="🔒"; card.appendChild(l); }
    cardData.set(card, {sk, canvas:c, hover:false, t:Math.random()*3});
    card.addEventListener("mouseenter", ()=>{ cardData.get(card).hover=true; });
    card.addEventListener("mouseleave", ()=>{ cardData.get(card).hover=false; });
    card.addEventListener("click", ()=>{
      selectedId = sk.id;
      for(const el of gridEl.querySelectorAll(".card.sel")) el.classList.remove("sel");
      card.classList.add("sel");
      updatePreview();
      snd.tick();
    });
    card.addEventListener("dblclick", ()=>{
      if(owned.includes(sk.id) && equippedId!==sk.id) equipSkin(sk);
      else if(!owned.includes(sk.id)) openConfirm(sk);
    });
    return card;
  }

  function renderShop(){
    let list = SKINS.slice();
    if(filter!=="all") list = list.filter(s=>s.r===filter);
    if(query) list = list.filter(s=>s.name.toLowerCase().includes(query)||s.desc.toLowerCase().includes(query)||s.r.includes(query));
    const rrank = r=>RARITY[r].rank;
    if(sortMode==="rarity") list.sort((a,b)=>rrank(a.r)-rrank(b.r)||skinPrice(a)-skinPrice(b));
    else if(sortMode==="priceAsc") list.sort((a,b)=>skinPrice(a)-skinPrice(b));
    else if(sortMode==="priceDesc") list.sort((a,b)=>skinPrice(b)-skinPrice(a));
    else if(sortMode==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortMode==="owned") list.sort((a,b)=>(owned.includes(b.id)?1:0)-(owned.includes(a.id)?1:0)||rrank(a.r)-rrank(b.r));

    gridEl.innerHTML="";
    for(const sk of list) gridEl.appendChild(buildCard(sk));
    if(!SKIN_BY_ID[selectedId]) selectedId = equippedId;
    updatePreview();
  }

  function updatePreview(){
    const sk = SKIN_BY_ID[selectedId] || equippedSkin();
    pvName.textContent = sk.name;
    pvRare.textContent = RARITY[sk.r].name;
    pvRare.style.color = RARITY[sk.r].color;
    pvDesc.textContent = sk.desc;
    pvAcc.textContent = accLabel(sk.acc);
    pvTrail.textContent = sk.trail.toUpperCase();
    pvTrait.textContent = skinTraitLabel(sk);
    const isOwned = owned.includes(sk.id);
    const isEq = equippedId===sk.id;
    pvBtn.className = "pvBtn";
    if(isEq){ pvBtn.classList.add("equipped"); pvBtn.textContent="✓ EQUIPPED"; pvBtn.disabled=true; }
    else if(isOwned){ pvBtn.classList.add("equip"); pvBtn.textContent="EQUIP"; pvBtn.disabled=false; }
    else {
      pvBtn.classList.add("buy");
      const cost = skinPrice(sk);
      if(carrotBank>=cost) pvBtn.textContent = "UNLOCK — "+cost+" 🥕";
      else { pvBtn.classList.add("no"); pvBtn.textContent = "NEED "+(cost-carrotBank)+" MORE 🥕"; }
    }
  }
  pvBtn.addEventListener("click", ()=>{
    const sk = SKIN_BY_ID[selectedId]; if(!sk) return;
    if(owned.includes(sk.id)){
      if(equippedId!==sk.id) equipSkin(sk);
    } else openConfirm(sk);
  });

  function equipSkin(sk){
    equippedId = sk.id; saveAll(); snd.equip();
    toast("EQUIPPED "+sk.name.toUpperCase());
    renderShop();
  }

  // ---- Confirm modal ----

  // ---- Toast ----
  const toastEl = document.getElementById("toastEl");
  let toastT = 0;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); toastT = performance.now()+1800; }
